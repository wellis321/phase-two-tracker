<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Repairs systems connected through APIs" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="370" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Typical repairs ecosystem: lots of systems, all talking through APIs</text><rect x="280" y="130" width="200" height="90" rx="0" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380.0" y="160.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Housing / repairs</text><text x="380.0" y="180.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">management system</text><text x="380.0" y="200.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">(the "core")</text><rect x="10" y="60" width="200" height="50" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="110.0" y="89.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Tenant portal &amp; app</text><rect x="10" y="200" width="200" height="50" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="110.0" y="229.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Contact centre</text><rect x="275" y="45" width="200" height="50" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="375.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Contractor mobile app</text><rect x="540" y="60" width="200" height="50" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="640.0" y="89.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Schedule of Rates</text><rect x="540" y="200" width="200" height="50" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="640.0" y="229.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Finance &amp; payments</text><rect x="280" y="255" width="210" height="50" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="385.0" y="284.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Email / SMS notifications</text><line x1="212" y1="85" x2="278" y2="150" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="212" y1="225" x2="278" y2="200" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="380" y1="97" x2="380" y2="128" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="482" y1="150" x2="538" y2="95" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="482" y1="200" x2="538" y2="225" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="380" y1="222" x2="380" y2="253" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="380" y="330" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Each arrow is an integration. The quality of those arrows decides how smoothly a repair flows.</text><text x="380" y="350" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Illustrative only: your real landscape will differ. Mapping it is a great first task.</text></svg>