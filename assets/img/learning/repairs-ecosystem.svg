nts="212,105 278,178" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="212,300 278,222" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="380,102 380,153" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="548,105 482,178" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="548,300 482,222" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="380,328 380,247" fill="none" stroke="#c9d4cf" stroke-width="2"/><rect x="280" y="155" width="200" height="90" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380.0" y="184.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Housing / repairs</text><text x="380.0" y="205.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">management system</text><text x="380.0" y="226.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">(the core)</text><rect x="10" y="80" width="200" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="110.0" y="109.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Tenant portal</text><rect x="10" y="275" width="200" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="110.0" y="304.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Customer Support</text><rect x="280" y="50" width="200" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="380.0" y="79.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Contractor app</text><rect x="550" y="80" width="200" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="650.0" y="109.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Schedule of Rates</text><rect x="550" y="275" width="200" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="650.0" y="304.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Finance</text><rect x="280" y="330" width="200" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="380.0" y="359.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Email / SMS</text><rect class="hl" x="10" y="80" width="200" height="50" fill="#006A51" style="opacity:0;animation:hl1 14s linear infinite"/><rect class="hl" x="280" y="50" width="200" height="50" fill="#006A51" style="opacity:0;animation:hl2 14s linear infinite"/><rect class="hl" x="280" y="155" width="200" height="90" fill="#006A51" style="opacity:0;animation:hl3 14s linear infinite"/><rect class="hl" x="550" y="80" width="200" height="50" fill="#006A51" style="opacity:0;animation:hl4 14s linear infinite"/><rect class="hl" x="550" y="275" width="200" height="50" fill="#006A51" style="opacity:0;animation:hl5 14s linear infinite"/><rect class="hl" x="280" y="330" width="200" height="50" fill="#006A51" style="opacity:0;animation:hl6 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv7 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv8 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv9 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><g class="dot" style="opacity:0;animation:mv10 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv11 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv12 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb13 14s linear infinite">1. A tenant reports a leak through the portal</text><text class="lab slot" x="380" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb14 14s linear infinite">2. A planner allocates the job and it reaches the contractor's app</text><text class="lab slot" x="380" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb15 14s linear infinite">3. The operative marks it complete</text><text class="lab slot" x="380" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb16 14s linear infinite">4. The price is checked against the Schedule of Rates</text><text class="lab slot" x="380" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb17 14s linear infinite">5. Payment is approved and sent to finance</text><text class="lab slot" x="380" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb18 14s linear infinite">6. The tenant is told it is fixed</text><text x="380" y="430" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Each line is an integration. The quality of those connections decides how smoothly a repair flows.</text></svg>