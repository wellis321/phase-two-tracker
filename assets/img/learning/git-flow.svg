<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="A git branch is created, changed, reviewed by a colleague through a pull request and merged back to main"><title>A git branch is created, changed, reviewed by a colleague through a pull request and merged back to main</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}47%{opacity:0}48.5%{opacity:0.3}63%{opacity:0.3}64.5%{opacity:0}100%{opacity:0}}@keyframes mv2{0%{opacity:0;transform:translate(150px,90px)}5.95%{opacity:0;transform:translate(150px,90px)}6%{opacity:1;transform:translate(150px,90px)}16.9%{opacity:1;transform:translate(210px,190px)}44%{opacity:1;transform:translate(500px,190px)}44.8%{opacity:0;transform:translate(500px,190px)}100%{opacity:0;transform:translate(500px,190px)}}@keyframes mv3{0%{opacity:0;transform:translate(500px,190px)}65.95%{opacity:0;transform:translate(500px,190px)}66%{opacity:1;transform:translate(500px,190px)}76.58%{opacity:1;transform:translate(560px,90px)}92%{opacity:1;transform:translate(730px,90px)}92.8%{opacity:0;transform:translate(730px,90px)}100%{opacity:0;transform:translate(730px,90px)}}@keyframes lb4{0%{opacity:0}3%{opacity:0}4%{opacity:1}22%{opacity:1}23%{opacity:0}100%{opacity:0}}@keyframes lb5{0%{opacity:0}23%{opacity:0}24%{opacity:1}45%{opacity:1}46%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}46%{opacity:0}47%{opacity:1}64%{opacity:1}65%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}65%{opacity:0}66%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="330" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Branch, review, merge</text><text x="30" y="62" text-anchor="start" font-size="12" font-weight="700" fill="#4a5550">main (the trusted version)</text><polyline points="30,90 730,90" fill="none" stroke="#1a2420" stroke-width="3"/><rect x="53" y="83" width="14" height="14" fill="#1a2420"/><rect x="143" y="83" width="14" height="14" fill="#1a2420"/><rect x="603" y="83" width="14" height="14" fill="#1a2420"/><rect x="693" y="83" width="14" height="14" fill="#1a2420"/><polyline points="150,90 210,190 500,190 560,90" fill="none" stroke="#006A51" stroke-width="3"/><text x="210" y="172" text-anchor="start" font-size="12" font-weight="700" fill="#006A51">your branch (a safe copy)</text><rect x="263" y="183" width="14" height="14" fill="#006A51"/><rect x="343" y="183" width="14" height="14" fill="#006A51"/><rect x="423" y="183" width="14" height="14" fill="#006A51"/><rect x="290" y="225" width="180" height="50" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380.0" y="245.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Code review</text><text x="380.0" y="264.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">a colleague checks it</text><rect class="hl" x="290" y="225" width="180" height="50" fill="#006A51" style="opacity:0;animation:hl1 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv2 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb4 14s linear infinite">1. Make a branch: a safe copy of main to work on</text><text class="lab slot" x="380" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb5 14s linear infinite">2. Make changes in small, labelled commits</text><text class="lab slot" x="380" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb6 14s linear infinite">3. Open a pull request: a colleague reviews every change</text><text class="lab slot" x="380" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb7 14s linear infinite">4. Approved? Merge it into main. Anything can be undone.</text></svg>