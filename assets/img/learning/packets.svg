<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" role="img" aria-label="A message split into packets travelling via routers" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="325" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Data travels as small packets, each finding its own route</text><rect x="20" y="100" width="110" height="70" rx="0" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="75.0" y="130.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Your phone</text><text x="75.0" y="149.35" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">sends a photo</text><rect x="630" y="100" width="110" height="70" rx="0" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="685.0" y="130.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Council</text><text x="685.0" y="149.35" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">server</text><rect x="240" y="50" width="40" height="40" fill="#f7f8f7" stroke="#4f9c88" stroke-width="1.5"/><text x="260" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9c88">R</text><rect x="240" y="135" width="40" height="40" fill="#f7f8f7" stroke="#4f9c88" stroke-width="1.5"/><text x="260" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9c88">R</text><rect x="240" y="220" width="40" height="40" fill="#f7f8f7" stroke="#4f9c88" stroke-width="1.5"/><text x="260" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9c88">R</text><rect x="400" y="80" width="40" height="40" fill="#f7f8f7" stroke="#4f9c88" stroke-width="1.5"/><text x="420" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9c88">R</text><rect x="400" y="190" width="40" height="40" fill="#f7f8f7" stroke="#4f9c88" stroke-width="1.5"/><text x="420" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9c88">R</text><rect x="520" y="135" width="40" height="40" fill="#f7f8f7" stroke="#4f9c88" stroke-width="1.5"/><text x="540" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9c88">R</text><line x1="132" y1="135" x2="238" y2="75" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><line x1="132" y1="135" x2="238" y2="155" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><line x1="132" y1="135" x2="238" y2="240" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="70" x2="400" y2="100" stroke="#c9d4cf" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="155" x2="400" y2="100" stroke="#c9d4cf" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="155" x2="400" y2="210" stroke="#c9d4cf" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="240" x2="400" y2="210" stroke="#c9d4cf" stroke-width="2" marker-end="url(#a)"/><line x1="440" y1="100" x2="518" y2="150" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><line x1="440" y1="210" x2="518" y2="160" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="155" x2="628" y2="135" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><text x="380" y="285" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">R = router, a traffic-director. If one route is busy or broken, packets simply go another way.</text><text x="380" y="307" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">At the other end they are put back together in the right order.</text></svg>