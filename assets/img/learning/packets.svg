 lb5{0%{opacity:0}4%{opacity:0}5%{opacity:1}50%{opacity:1}51%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}54%{opacity:0}55%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="380" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">How a message really travels</text><rect x="20" y="150" width="110" height="80" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="75.0" y="184.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Your phone</text><text x="75.0" y="205.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">sends a photo</text><rect x="630" y="150" width="110" height="80" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="685.0" y="184.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Council</text><text x="685.0" y="205.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">server</text><polyline points="132,190 248,78" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="132,190 248,190" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="132,190 248,302" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="248,78 408,128" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="248,190 408,128" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="248,190 408,252" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="248,302 408,252" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="408,128 538,190" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="408,252 538,190" fill="none" stroke="#c9d4cf" stroke-width="2"/><polyline points="538,190 628,190" fill="none" stroke="#c9d4cf" stroke-width="2"/><rect x="230" y="60" width="36" height="36" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="248" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">R</text><rect x="230" y="172" width="36" height="36" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="248" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">R</text><rect x="230" y="284" width="36" height="36" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="248" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">R</text><rect x="390" y="110" width="36" height="36" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="408" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">R</text><rect x="390" y="234" width="36" height="36" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="408" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">R</text><rect x="520" y="172" width="36" height="36" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="538" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">R</text><g class="dot" style="opacity:0;animation:mv1 12s linear infinite"><rect x="-11.0" y="-11.0" width="22" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text></g><g class="dot" style="opacity:0;animation:mv2 12s linear infinite"><rect x="-11.0" y="-11.0" width="22" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text></g><g class="dot" style="opacity:0;animation:mv3 12s linear infinite"><rect x="-11.0" y="-11.0" width="22" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text></g><rect class="hl" x="630" y="150" width="110" height="80" fill="#006A51" style="opacity:0;animation:hl4 12s linear infinite"/><text class="lab slot" x="380" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb5 12s linear infinite">The photo is cut into numbered packets. Each finds its own route.</text><text class="lab slot" x="380" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 12s linear infinite">At the other end they are put back together: 1, 2, 3.</text><text x="380" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">R = router, a traffic director. If one route is busy or broken, packets go another way.</text></svg>