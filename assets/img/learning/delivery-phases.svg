<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" role="img" aria-label="Discovery, alpha, beta and live phases" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="245" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">The phases of building a digital service</text><polygon points="20,60 170,60 195,110 170,160 20,160 45,110" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="115" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Discovery</text><text x="115" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">Understand the problem</text><text x="115" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">and the people</text><polygon points="205,60 355,60 380,110 355,160 205,160 230,110" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="300" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Alpha</text><text x="300" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">Try ideas cheaply,</text><text x="300" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">prototypes</text><polygon points="390,60 540,60 565,110 540,160 390,160 415,110" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="485" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Beta</text><text x="485" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">Build it for real,</text><text x="485" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">small group of users</text><polygon points="575,60 725,60 750,110 725,160 575,160 600,110" fill="#006A51" stroke="#006A51" stroke-width="1.5"/><text x="670" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Live</text><text x="670" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Everyone uses it,</text><text x="670" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">keep improving</text><text x="380" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">At the end of each phase, ask: have we learned enough to justify the next step, or should we stop or change direction?</text><text x="380" y="222" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Stopping early because you learned something is a success, not a failure.</text></svg>