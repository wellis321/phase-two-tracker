<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="A single repair passing from the tenant through the front end, API, back end, database, contractor and finance"><title>A single repair passing from the tenant through the front end, API, back end, database, contractor and finance</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(68px,70px)}4.95%{opacity:0;transform:translate(68px,70px)}5%{opacity:1;transform:translate(68px,70px)}17.83%{opacity:1;transform:translate(172px,70px)}30.67%{opacity:1;transform:translate(276px,70px)}43.5%{opacity:1;transform:translate(380px,70px)}56.33%{opacity:1;transform:translate(484px,70px)}69.17%{opacity:1;transform:translate(588px,70px)}82%{opacity:1;transform:translate(692px,70px)}82.8%{opacity:0;transform:translate(692px,70px)}100%{opacity:0;transform:translate(692px,70px)}}@keyframes hl2{0%{opacity:0}0%{opacity:0}1.5%{opacity:0.16}10%{opacity:0.16}11.5%{opacity:0}100%{opacity:0}}@keyframes lb3{0%{opacity:0}-1%{opacity:0}0%{opacity:1}10.4%{opacity:1}11.4%{opacity:0}100%{opacity:0}}@keyframes hl4{0%{opacity:0}12.83%{opacity:0}14.33%{opacity:0.16}22.83%{opacity:0.16}24.33%{opacity:0}100%{opacity:0}}@keyframes lb5{0%{opacity:0}11.83%{opacity:0}12.83%{opacity:1}23.23%{opacity:1}24.23%{opacity:0}100%{opacity:0}}@keyframes hl6{0%{opacity:0}25.67%{opacity:0}27.17%{opacity:0.16}35.67%{opacity:0.16}37.17%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}24.67%{opacity:0}25.67%{opacity:1}36.07%{opacity:1}37.07%{opacity:0}100%{opacity:0}}@keyframes hl8{0%{opacity:0}38.5%{opacity:0}40%{opacity:0.16}48.5%{opacity:0.16}50%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}37.5%{opacity:0}38.5%{opacity:1}48.9%{opacity:1}49.9%{opacity:0}100%{opacity:0}}@keyframes hl10{0%{opacity:0}51.33%{opacity:0}52.83%{opacity:0.16}61.33%{opacity:0.16}62.83%{opacity:0}100%{opacity:0}}@keyframes lb11{0%{opacity:0}50.33%{opacity:0}51.33%{opacity:1}61.73%{opacity:1}62.73%{opacity:0}100%{opacity:0}}@keyframes hl12{0%{opacity:0}64.17%{opacity:0}65.67%{opacity:0.16}74.17%{opacity:0.16}75.67%{opacity:0}100%{opacity:0}}@keyframes lb13{0%{opacity:0}63.17%{opacity:0}64.17%{opacity:1}74.57%{opacity:1}75.57%{opacity:0}100%{opacity:0}}@keyframes hl14{0%{opacity:0}77%{opacity:0}78.5%{opacity:0.16}87%{opacity:0.16}88.5%{opacity:0}100%{opacity:0}}@keyframes lb15{0%{opacity:0}76%{opacity:0}77%{opacity:1}87.4%{opacity:1}88.4%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="330" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">One repair, seven hand-offs</text><polyline points="68,70 692,70" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="95" width="96" height="80" fill="#fff" stroke="#006A51" stroke-width="1.5"/><text x="68.0" y="130.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Tenant</text><text x="68.0" y="149.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">phone</text><rect x="124" y="95" width="96" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="172.0" y="130.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Front</text><text x="172.0" y="149.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">end</text><rect x="228" y="95" width="96" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="276.0" y="139.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">API</text><rect x="332" y="95" width="96" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="380.0" y="130.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Back</text><text x="380.0" y="149.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">end</text><rect x="436" y="95" width="96" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="484.0" y="130.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Data-</text><text x="484.0" y="149.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">base</text><rect x="540" y="95" width="96" height="80" fill="#fff" stroke="#006A51" stroke-width="1.5"/><text x="588.0" y="130.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Contractor</text><text x="588.0" y="149.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">app</text><rect x="644" y="95" width="96" height="80" fill="#fff" stroke="#006A51" stroke-width="1.5"/><text x="692.0" y="139.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Finance</text><g class="dot" style="opacity:0;animation:mv1 16s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#006A51"/></g><rect class="hl" x="20" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl2 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb3 16s linear infinite">The tenant reports a leak on their phone</text><rect class="hl" x="124" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl4 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb5 16s linear infinite">The form is built and sent as "POST /repairs"</text><rect class="hl" x="228" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl6 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 16s linear infinite">The API checks the token and passes the message on</text><rect class="hl" x="332" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl8 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb9 16s linear infinite">The back end applies the rules: urgent, patch, address</text><rect class="hl" x="436" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl10 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb11 16s linear infinite">The repair is saved. The tenant sees "201 Created"</text><rect class="hl" x="540" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl12 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb13 16s linear infinite">The job appears in the contractor's app</text><rect class="hl" x="644" y="95" width="96" height="80" fill="#006A51" style="opacity:0;animation:hl14 16s linear infinite"/><text class="lab slot" x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb15 16s linear infinite">The completed job is checked and paid</text><text x="380" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Each hand-off is an integration. When a repair goes wrong, ask which hand-off failed.</text></svg>