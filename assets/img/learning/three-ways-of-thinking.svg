<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Three ways of organising code: step by step, as objects, or as chains of functions"><title>Three ways of organising code: step by step, as objects, or as chains of functions</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="360" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Three ways of thinking about code</text><rect x="20" y="60" width="220" height="230" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="20" y="60" width="220" height="56" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="130" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Procedural</text><text x="130" y="104" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">A recipe: do this, then this</text><text x="36" y="150" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1. Get the open repairs</text><text x="36" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2. For each one, check priority</text><text x="36" y="206" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3. If emergency, notify planner</text><text x="36" y="234" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4. Save the result</text><rect x="270" y="60" width="220" height="230" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="270" y="60" width="220" height="56" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="380" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Object-oriented</text><text x="380" y="104" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Things that know how to behave</text><text x="286" y="150" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Repair</text><text x="286" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  priority, status</text><text x="286" y="206" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  escalate()</text><text x="286" y="234" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  close()</text><rect x="520" y="60" width="220" height="230" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="520" y="60" width="220" height="56" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="630" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Functional</text><text x="630" y="104" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">A chain of small machines</text><text x="536" y="150" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">repairs</text><text x="536" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  -&gt; keep(open)</text><text x="536" y="206" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  -&gt; map(cost)</text><text x="536" y="234" text-anchor="start" font-size="12.5" font-weight="400" fill="#1a2420" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  -&gt; total()</text><text x="380" y="325" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Most real systems mix all three. Teams argue about the balance, not about which one is "right".</text></svg>