<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The first request goes to the database and is slow; the second is answered from the cache and is fast"><title>The first request goes to the database and is slow; the second is answered from the cache and is fast</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(180px,140px)}3.95%{opacity:0;transform:translate(180px,140px)}4%{opacity:1;transform:translate(180px,140px)}11%{opacity:1;transform:translate(305px,140px)}11.8%{opacity:0;transform:translate(305px,140px)}100%{opacity:0;transform:translate(305px,140px)}}@keyframes mv2{0%{opacity:0;transform:translate(455px,140px)}13.95%{opacity:0;transform:translate(455px,140px)}14%{opacity:1;transform:translate(455px,140px)}22%{opacity:1;transform:translate(580px,140px)}22.8%{opacity:0;transform:translate(580px,140px)}100%{opacity:0;transform:translate(580px,140px)}}@keyframes mv3{0%{opacity:0;transform:translate(580px,165px)}25.95%{opacity:0;transform:translate(580px,165px)}26%{opacity:1;transform:translate(580px,165px)}34%{opacity:1;transform:translate(455px,165px)}34.8%{opacity:0;transform:translate(455px,165px)}100%{opacity:0;transform:translate(455px,165px)}}@keyframes mv4{0%{opacity:0;transform:translate(305px,165px)}35.95%{opacity:0;transform:translate(305px,165px)}36%{opacity:1;transform:translate(305px,165px)}43%{opacity:1;transform:translate(180px,165px)}43.8%{opacity:0;transform:translate(180px,165px)}100%{opacity:0;transform:translate(180px,165px)}}@keyframes fd5{0%{opacity:0}35%{opacity:0}38%{opacity:1}50%{opacity:1}52%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:0}100%{opacity:0}}@keyframes mv6{0%{opacity:0;transform:translate(180px,140px)}55.95%{opacity:0;transform:translate(180px,140px)}56%{opacity:1;transform:translate(180px,140px)}62%{opacity:1;transform:translate(305px,140px)}62.8%{opacity:0;transform:translate(305px,140px)}100%{opacity:0;transform:translate(305px,140px)}}@keyframes mv7{0%{opacity:0;transform:translate(305px,165px)}65.95%{opacity:0;transform:translate(305px,165px)}66%{opacity:1;transform:translate(305px,165px)}72%{opacity:1;transform:translate(180px,165px)}72.8%{opacity:0;transform:translate(180px,165px)}100%{opacity:0;transform:translate(180px,165px)}}@keyframes fd8{0%{opacity:0}72%{opacity:0}74%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes hl9{0%{opacity:0}30%{opacity:0}31.5%{opacity:0.3}36%{opacity:0.3}37.5%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}3%{opacity:0}4%{opacity:1}46%{opacity:1}47%{opacity:0}100%{opacity:0}}@keyframes lb11{0%{opacity:0}47%{opacity:0}48%{opacity:1}54%{opacity:1}55%{opacity:0}100%{opacity:0}}@keyframes lb12{0%{opacity:0}55%{opacity:0}56%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="330" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Moving work away from the database: a cache</text><rect x="30" y="110" width="150" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="105.0" y="145.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Application</text><text x="105.0" y="164.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">asks for data</text><rect x="305" y="110" width="150" height="80" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380.0" y="145.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Cache</text><text x="380.0" y="164.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">fast short-term memory</text><rect x="580" y="110" width="150" height="80" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="655.0" y="145.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Database</text><text x="655.0" y="164.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">the source of truth</text><polyline points="182,140 303,140" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="457,140 578,140" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="578,165 457,165" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="303,165 182,165" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><g class="dot" style="opacity:0;animation:mv1 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv2 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv3 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><g class="dot" style="opacity:0;animation:mv4 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><g class="fd" style="animation:fd5 12s linear infinite"><text x="655" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">about 200 ms</text></g><g class="dot" style="opacity:0;animation:mv6 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv7 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><g class="fd" style="animation:fd8 12s linear infinite"><text x="380" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51">about 2 ms</text></g><rect class="hl" x="305" y="110" width="150" height="80" fill="#006A51" style="opacity:0;animation:hl9 12s linear infinite"/><text class="lab slot" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 12s linear infinite">First request: not in the cache, so the database is asked (slow)</text><text class="lab slot" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb11 12s linear infinite">The answer is kept in the cache on the way back</text><text class="lab slot" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb12 12s linear infinite">Second request: answered from the cache. The database is never troubled.</text></svg>