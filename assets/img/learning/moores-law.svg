0}70%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}@keyframes lb15{0%{opacity:0}69%{opacity:0}70%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="430" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Moore's law: transistors per chip, 1971 to today</text><line x1="110" y1="300.0" x2="715" y2="300.0" stroke="#c9d4cf" stroke-width="1"/><text x="102" y="304.0" text-anchor="end" font-size="11" font-weight="400" fill="#4a5550">1 thousand</text><line x1="110" y1="217.4" x2="715" y2="217.4" stroke="#c9d4cf" stroke-width="1"/><text x="102" y="221.41176470588235" text-anchor="end" font-size="11" font-weight="400" fill="#4a5550">1 million</text><line x1="110" y1="134.8" x2="715" y2="134.8" stroke="#c9d4cf" stroke-width="1"/><text x="102" y="138.8235294117647" text-anchor="end" font-size="11" font-weight="400" fill="#4a5550">1 billion</text><line x1="110" y1="79.8" x2="715" y2="79.8" stroke="#c9d4cf" stroke-width="1"/><text x="102" y="83.76470588235296" text-anchor="end" font-size="11" font-weight="400" fill="#4a5550">100 billion</text><text x="110.0" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">1970</text><text x="220.0" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">1980</text><text x="330.0" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">1990</text><text x="440.0" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">2000</text><text x="550.0" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">2010</text><text x="660.0" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">2020</text><polyline points="121.0,290.04184545551567 693.0,74.5751991473202" fill="none" stroke="#006A51" stroke-width="1.5" stroke-dasharray="6 5"/><text x="396.0" y="174.4521116534986" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">doubling every two years</text><g class="fd" style="animation:fd1 16s linear infinite"><rect x="116.0" y="285.0" width="10" height="10" fill="#006A51"/><text x="131.0" y="294.0" text-anchor="start" font-size="12" font-weight="700" fill="#1a2420">1971: Intel 4004, 2,300</text></g><g class="fd" style="animation:fd2 16s linear infinite"><rect x="193.0" y="254.7" width="10" height="10" fill="#006A51"/></g><g class="fd" style="animation:fd3 16s linear infinite"><rect x="270.0" y="227.8" width="10" height="10" fill="#006A51"/></g><g class="fd" style="animation:fd4 16s linear infinite"><rect x="358.0" y="198.9" width="10" height="10" fill="#006A51"/><text x="373.0" y="207.9" text-anchor="start" font-size="12" font-weight="700" fill="#1a2420">1993: about 3 million</text></g><g class="fd" style="animation:fd5 16s linear infinite"><rect x="435.0" y="167.7" width="10" height="10" fill="#006A51"/></g><g class="fd" style="animation:fd6 16s linear infinite"><rect x="501.0" y="144.6" width="10" height="10" fill="#006A51"/></g><g class="fd" style="animation:fd7 16s linear infinite"><rect x="567.0" y="125.8" width="10" height="10" fill="#006A51"/><text x="562.0" y="134.8" text-anchor="end" font-size="12" font-weight="700" fill="#1a2420">2012: about 1.4 billion</text></g><g class="fd" style="animation:fd8 16s linear infinite"><rect x="622.0" y="94.6" width="10" height="10" fill="#006A51"/></g><g class="fd" style="animation:fd9 16s linear infinite"><rect x="688.0" y="74.8" width="10" height="10" fill="#006A51"/><text x="683.0" y="83.8" text-anchor="end" font-size="12" font-weight="700" fill="#1a2420">Today: about 100 billion</text></g><rect x="30" y="336" width="700" height="76" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><text class="lab slot" x="380" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 16s linear infinite">1971: 2,300 transistors on one chip</text><text class="lab slot" x="380" y="387" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb11 16s linear infinite">Gordon Moore noticed they were doubling about every two years</text><text class="lab slot" x="380" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb12 16s linear infinite">Doubling again and again: millions, then billions</text><text class="lab slot" x="380" y="387" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb13 16s linear infinite">The same job, switching on and off, done far smaller each time</text><text class="lab slot" x="380" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb14 16s linear infinite">Today: about 100 billion on one chip</text><text class="lab slot" x="380" y="387" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb15 16s linear infinite">Heat, cost and the size of atoms now slow the pace</text></svg>