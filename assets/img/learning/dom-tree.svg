<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="The browser turns HTML into a tree called the DOM, and JavaScript changes the tree so the page updates"><title>The browser turns HTML into a tree called the DOM, and JavaScript changes the tree so the page updates</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes fd1{0%{opacity:1}56%{opacity:1}58%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:1}100%{opacity:1}}@keyframes fd2{0%{opacity:0}56%{opacity:0}58%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes mv3{0%{opacity:0;transform:translate(430px,298px)}29.95%{opacity:0;transform:translate(430px,298px)}30%{opacity:1;transform:translate(430px,298px)}42%{opacity:1;transform:translate(540px,235px)}42.8%{opacity:0;transform:translate(540px,235px)}100%{opacity:0;transform:translate(540px,235px)}}@keyframes mv4{0%{opacity:0;transform:translate(430px,298px)}49.95%{opacity:0;transform:translate(430px,298px)}50%{opacity:1;transform:translate(430px,298px)}62%{opacity:1;transform:translate(320px,235px)}62.8%{opacity:0;transform:translate(320px,235px)}100%{opacity:0;transform:translate(320px,235px)}}@keyframes hl5{0%{opacity:0}28%{opacity:0}29.5%{opacity:0.3}44%{opacity:0.3}45.5%{opacity:0}100%{opacity:0}}@keyframes hl6{0%{opacity:0}48%{opacity:0}49.5%{opacity:0.3}64%{opacity:0.3}65.5%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}3%{opacity:0}4%{opacity:1}26%{opacity:1}27%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}27%{opacity:0}28%{opacity:1}46%{opacity:1}47%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}47%{opacity:0}48%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="380" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">The DOM: the page as a tree that JavaScript can change</text><rect x="20" y="60" width="230" height="150" fill="#1a2420"/><text x="34" y="92" text-anchor="start" font-size="12" font-weight="400" fill="#e6edf3" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">&lt;body&gt;</text><text x="34" y="118" text-anchor="start" font-size="12" font-weight="400" fill="#e6edf3" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  &lt;h1&gt;Report a repair&lt;/h1&gt;</text><text x="34" y="144" text-anchor="start" font-size="12" font-weight="400" fill="#e6edf3" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  &lt;p&gt;What is wrong?&lt;/p&gt;</text><text x="34" y="170" text-anchor="start" font-size="12" font-weight="400" fill="#e6edf3" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  &lt;button&gt;Send&lt;/button&gt;</text><text x="34" y="196" text-anchor="start" font-size="12" font-weight="400" fill="#e6edf3" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">&lt;/body&gt;</text><text x="135" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">1. HTML text</text><polyline points="410,87 410,118" fill="none" stroke="#4a5550" stroke-width="2"/><polyline points="410,152 320,198" fill="none" stroke="#4a5550" stroke-width="2"/><polyline points="410,152 430,198" fill="none" stroke="#4a5550" stroke-width="2"/><polyline points="410,152 540,198" fill="none" stroke="#4a5550" stroke-width="2"/><rect x="365" y="53" width="90" height="34" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="410.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">html</text><rect x="365" y="118" width="90" height="34" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="410.0" y="139.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">body</text><rect x="275" y="198" width="90" height="34" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="320.0" y="219.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">h1</text><rect x="385" y="198" width="90" height="34" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="430.0" y="219.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">p</text><rect x="495" y="198" width="90" height="34" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="540.0" y="219.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">button</text><text x="430" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">2. The DOM tree the browser builds</text><rect x="590" y="60" width="150" height="150" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><g class="fd" style="animation:fd1 14s linear infinite"><text x="605" y="92" font-size="14" font-weight="700" fill="#1a2420">Report a repair</text></g><g class="fd" style="animation:fd2 14s linear infinite"><text x="605" y="92" font-size="14" font-weight="700" fill="#006A51">Repair reported</text></g><text x="605" y="120" text-anchor="start" font-size="12" font-weight="400" fill="#4a5550">What is wrong?</text><rect x="605" y="160" width="70" height="30" fill="#006A51"/><text x="640" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Send</text><text x="665" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">3. What you see</text><rect x="300" y="300" width="260" height="44" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="430.0" y="317.09999999999997" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">JavaScript</text><text x="430.0" y="336.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">finds nodes and changes them</text><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv4 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><rect class="hl" x="495" y="198" width="90" height="34" fill="#006A51" style="opacity:0;animation:hl5 14s linear infinite"/><rect class="hl" x="275" y="198" width="90" height="34" fill="#006A51" style="opacity:0;animation:hl6 14s linear infinite"/><text class="lab slot" x="380" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 14s linear infinite">The browser reads the HTML and builds a tree of nodes</text><text class="lab slot" x="380" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb8 14s linear infinite">JavaScript finds the button node when it is clicked</text><text class="lab slot" x="380" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb9 14s linear infinite">It changes the heading node: the page redraws instantly, with no reload</text></svg>