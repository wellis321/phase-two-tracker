<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="AI drafts and a person checks, refines and decides: a loop with a human accountable at the end"><title>AI drafts and a person checks, refines and decides: a loop with a human accountable at the end</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(125px,140px)}3.95%{opacity:0;transform:translate(125px,140px)}4%{opacity:1;transform:translate(125px,140px)}20%{opacity:1;transform:translate(380px,140px)}20.8%{opacity:0;transform:translate(380px,140px)}100%{opacity:0;transform:translate(380px,140px)}}@keyframes hl2{0%{opacity:0}12%{opacity:0}13.5%{opacity:0.3}28%{opacity:0.3}29.5%{opacity:0}100%{opacity:0}}@keyframes mv3{0%{opacity:0;transform:translate(380px,140px)}29.95%{opacity:0;transform:translate(380px,140px)}30%{opacity:1;transform:translate(380px,140px)}46%{opacity:1;transform:translate(635px,140px)}46.8%{opacity:0;transform:translate(635px,140px)}100%{opacity:0;transform:translate(635px,140px)}}@keyframes mv4{0%{opacity:0;transform:translate(635px,182px)}51.95%{opacity:0;transform:translate(635px,182px)}52%{opacity:1;transform:translate(635px,182px)}53.26%{opacity:1;transform:translate(635px,215px)}72.74%{opacity:1;transform:translate(125px,215px)}74%{opacity:1;transform:translate(125px,182px)}74.8%{opacity:0;transform:translate(125px,182px)}100%{opacity:0;transform:translate(125px,182px)}}@keyframes lb5{0%{opacity:0}3%{opacity:0}4%{opacity:1}28%{opacity:1}29%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}29%{opacity:0}30%{opacity:1}50%{opacity:1}51%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}51%{opacity:0}52%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="330" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Using AI well: AI drafts, people decide</text><rect x="30" y="100" width="190" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="125.0" y="135.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">You</text><text x="125.0" y="154.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">give context and a clear task</text><rect x="285" y="100" width="190" height="80" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380.0" y="135.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">AI</text><text x="380.0" y="154.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">produces a first draft</text><rect x="540" y="100" width="190" height="80" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="635.0" y="135.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">You check</text><text x="635.0" y="154.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">facts, rules, fairness</text><polyline points="222,140 283,140" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="477,140 538,140" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="635,182 635,215 125,215 125,182" fill="none" stroke="#c9d4cf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="380" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Not right? Refine the instructions and go round again</text><g class="dot" style="opacity:0;animation:mv1 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><rect class="hl" x="285" y="100" width="190" height="80" fill="#006A51" style="opacity:0;animation:hl2 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv4 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb5 14s linear infinite">1. Give the AI the context, the task and the rules it must follow</text><text class="lab slot" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 14s linear infinite">2. Read the draft critically, as you would a new colleague's work</text><text class="lab slot" x="380" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 14s linear infinite">3. Refine and repeat. A person signs off and stays accountable.</text></svg>