<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="How storage grew: how many punched cards would fit on a floppy disk, a CD, a DVD and a 1 TB drive"><title>How storage grew: how many punched cards would fit on a floppy disk, a CD, a DVD and a 1 TB drive</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes fd1{0%{opacity:0}3%{opacity:0}6%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes fd2{0%{opacity:0}17%{opacity:0}20%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes fd3{0%{opacity:0}31%{opacity:0}34%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes fd4{0%{opacity:0}45%{opacity:0}48%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes fd5{0%{opacity:0}59%{opacity:0}62%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}3%{opacity:0}4%{opacity:1}17%{opacity:1}18%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}3%{opacity:0}4%{opacity:1}17%{opacity:1}18%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}18%{opacity:0}19%{opacity:1}31%{opacity:1}32%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}18%{opacity:0}19%{opacity:1}31%{opacity:1}32%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}32%{opacity:0}33%{opacity:1}45%{opacity:1}46%{opacity:0}100%{opacity:0}}@keyframes lb11{0%{opacity:0}32%{opacity:0}33%{opacity:1}45%{opacity:1}46%{opacity:0}100%{opacity:0}}@keyframes lb12{0%{opacity:0}46%{opacity:0}47%{opacity:1}59%{opacity:1}60%{opacity:0}100%{opacity:0}}@keyframes lb13{0%{opacity:0}46%{opacity:0}47%{opacity:1}59%{opacity:1}60%{opacity:0}100%{opacity:0}}@keyframes lb14{0%{opacity:0}60%{opacity:0}61%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}@keyframes lb15{0%{opacity:0}60%{opacity:0}61%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="440" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Storage, measured in punched cards</text><text x="40" y="70" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a5550">Medium</text><text x="330" y="70" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a5550">Holds</text><text x="470" y="70" text-anchor="start" font-size="12.5" font-weight="700" fill="#4a5550">Same as this many cards</text><g class="fd" style="animation:fd1 16s linear infinite"><rect x="30" y="82" width="700" height="42" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="40" y="108" font-size="14" font-weight="700" fill="#1a2420">Punched card</text><text x="330" y="108" font-size="14" fill="#1a2420">80 characters</text><text x="470" y="108" font-size="14" font-weight="700" fill="#006A51">1</text></g><g class="fd" style="animation:fd2 16s linear infinite"><rect x="30" y="132" width="700" height="42" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="40" y="158" font-size="14" font-weight="700" fill="#1a2420">Floppy disk (3.5 in)</text><text x="330" y="158" font-size="14" fill="#1a2420">1.44 MB</text><text x="470" y="158" font-size="14" font-weight="700" fill="#006A51">18,000</text></g><g class="fd" style="animation:fd3 16s linear infinite"><rect x="30" y="182" width="700" height="42" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="40" y="208" font-size="14" font-weight="700" fill="#1a2420">CD-ROM</text><text x="330" y="208" font-size="14" fill="#1a2420">700 MB</text><text x="470" y="208" font-size="14" font-weight="700" fill="#006A51">8.75 million</text></g><g class="fd" style="animation:fd4 16s linear infinite"><rect x="30" y="232" width="700" height="42" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="40" y="258" font-size="14" font-weight="700" fill="#1a2420">DVD</text><text x="330" y="258" font-size="14" fill="#1a2420">4.7 GB</text><text x="470" y="258" font-size="14" font-weight="700" fill="#006A51">59 million</text></g><g class="fd" style="animation:fd5 16s linear infinite"><rect x="30" y="282" width="700" height="42" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="40" y="308" font-size="14" font-weight="700" fill="#1a2420">Memory stick or SSD</text><text x="330" y="308" font-size="14" fill="#1a2420">1 TB</text><text x="470" y="308" font-size="14" font-weight="700" fill="#006A51">12.5 billion</text></g><rect x="30" y="346" width="700" height="76" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><text class="lab slot" x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 16s linear infinite">A punched card holds 80 characters</text><text class="lab slot" x="380" y="399" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb7 16s linear infinite">A box of 2,000 cards holds about 160 KB</text><text class="lab slot" x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb8 16s linear infinite">One floppy disk = about 18,000 cards</text><text class="lab slot" x="380" y="399" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb9 16s linear infinite">A stack of cards over 3 metres tall</text><text class="lab slot" x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 16s linear infinite">One CD = about 8.75 million cards</text><text class="lab slot" x="380" y="399" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb11 16s linear infinite">A stack about a mile high</text><text class="lab slot" x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb12 16s linear infinite">One DVD = about 59 million cards</text><text class="lab slot" x="380" y="399" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb13 16s linear infinite">A stack taller than Mount Everest</text><text class="lab slot" x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb14 16s linear infinite">One 1 TB drive = 12.5 billion cards</text><text class="lab slot" x="380" y="399" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb15 16s linear infinite">A stack about 2,250 km tall, in your pocket</text></svg>