<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="PUT replaces the whole record so missing fields are blanked, PATCH changes only the field sent"><title>PUT replaces the whole record so missing fields are blanked, PATCH changes only the field sent</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes fd1{0%{opacity:1}36%{opacity:1}42%{opacity:0.08}94%{opacity:0.08}95.5%{opacity:1}100%{opacity:1}}@keyframes fd2{0%{opacity:1}36%{opacity:1}42%{opacity:0.08}94%{opacity:0.08}95.5%{opacity:1}100%{opacity:1}}@keyframes fd3{0%{opacity:1}28%{opacity:1}30%{opacity:0}94%{opacity:0}95.5%{opacity:1}100%{opacity:1}}@keyframes fd4{0%{opacity:0}28%{opacity:0}30%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes fd5{0%{opacity:1}36%{opacity:1}42%{opacity:0.08}94%{opacity:0.08}95.5%{opacity:1}100%{opacity:1}}@keyframes hl6{0%{opacity:0}28%{opacity:0}29.5%{opacity:0.12}92%{opacity:0.12}93.5%{opacity:0}100%{opacity:0}}@keyframes mv7{0%{opacity:0;transform:translate(190px,92px)}5.95%{opacity:0;transform:translate(190px,92px)}6%{opacity:1;transform:translate(190px,92px)}24%{opacity:1;transform:translate(190px,138px)}24.8%{opacity:0;transform:translate(190px,138px)}100%{opacity:0;transform:translate(190px,138px)}}@keyframes fd8{0%{opacity:1}28%{opacity:1}30%{opacity:0}94%{opacity:0}95.5%{opacity:1}100%{opacity:1}}@keyframes fd9{0%{opacity:0}28%{opacity:0}30%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes hl10{0%{opacity:0}28%{opacity:0}29.5%{opacity:0.12}92%{opacity:0.12}93.5%{opacity:0}100%{opacity:0}}@keyframes mv11{0%{opacity:0;transform:translate(570px,92px)}5.95%{opacity:0;transform:translate(570px,92px)}6%{opacity:1;transform:translate(570px,92px)}24%{opacity:1;transform:translate(570px,138px)}24.8%{opacity:0;transform:translate(570px,138px)}100%{opacity:0;transform:translate(570px,138px)}}@keyframes lb12{0%{opacity:0}44%{opacity:0}45%{opacity:1}94%{opacity:1}95%{opacity:0}100%{opacity:0}}@keyframes lb13{0%{opacity:0}44%{opacity:0}45%{opacity:1}94%{opacity:1}95%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="450" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">PUT or PATCH? The same request, very different results</text><text x="190" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">PUT: replace the whole record</text><rect x="20" y="150" width="340" height="190" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><text x="36" y="176" text-anchor="start" font-size="14" font-weight="700" fill="#1a2420">Repair 4821</text><g class="fd" style="animation:fd1 12s linear infinite"><text x="36" y="208" font-size="13" fill="#4a5550">Address</text><text x="150" y="208" font-size="13" font-weight="700" fill="#1a2420">12 Example Street</text></g><g class="fd" style="animation:fd2 12s linear infinite"><text x="36" y="241" font-size="13" fill="#4a5550">Problem</text><text x="150" y="241" font-size="13" font-weight="700" fill="#1a2420">Leaking kitchen tap</text></g><text x="36" y="274" font-size="13" fill="#4a5550">Priority</text><g class="fd" style="animation:fd3 12s linear infinite"><text x="150" y="274" font-size="13" font-weight="700" fill="#1a2420">routine</text></g><g class="fd" style="animation:fd4 12s linear infinite"><text x="150" y="274" font-size="13" font-weight="700" fill="#006A51">emergency</text></g><g class="fd" style="animation:fd5 12s linear infinite"><text x="36" y="307" font-size="13" fill="#4a5550">Appointment</text><text x="150" y="307" font-size="13" font-weight="700" fill="#1a2420">Tue 10:00</text></g><rect class="hl" x="22" y="257" width="336" height="26" fill="#006A51" style="opacity:0;animation:hl6 12s linear infinite"/><g class="dot" style="opacity:0;animation:mv7 12s linear infinite"><rect x="-86.0" y="-13.0" width="172" height="26" fill="#006A51"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">{ priority: emergency }</text></g><text x="570" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">PATCH: change just part of it</text><rect x="400" y="150" width="340" height="190" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><text x="416" y="176" text-anchor="start" font-size="14" font-weight="700" fill="#1a2420">Repair 4821</text><text x="416" y="208" font-size="13" fill="#4a5550">Address</text><text x="530" y="208" font-size="13" font-weight="700" fill="#1a2420">12 Example Street</text><text x="416" y="241" font-size="13" fill="#4a5550">Problem</text><text x="530" y="241" font-size="13" font-weight="700" fill="#1a2420">Leaking kitchen tap</text><text x="416" y="274" font-size="13" fill="#4a5550">Priority</text><g class="fd" style="animation:fd8 12s linear infinite"><text x="530" y="274" font-size="13" font-weight="700" fill="#1a2420">routine</text></g><g class="fd" style="animation:fd9 12s linear infinite"><text x="530" y="274" font-size="13" font-weight="700" fill="#006A51">emergency</text></g><text x="416" y="307" font-size="13" fill="#4a5550">Appointment</text><text x="530" y="307" font-size="13" font-weight="700" fill="#1a2420">Tue 10:00</text><rect class="hl" x="402" y="257" width="336" height="26" fill="#006A51" style="opacity:0;animation:hl10 12s linear infinite"/><g class="dot" style="opacity:0;animation:mv11 12s linear infinite"><rect x="-86.0" y="-13.0" width="172" height="26" fill="#006A51"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">{ priority: emergency }</text></g><text class="lab slot" x="190" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb12 12s linear infinite">Address, problem and appointment: GONE</text><text class="lab slot" x="570" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb13 12s linear infinite">Only the priority changed. Everything else is intact.</text><text x="190" y="410" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">You must send every field. Anything left out is treated as empty.</text><text x="570" y="410" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">You send only what changes. The rest stays exactly as it was.</text><text x="380" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2420">Ask any supplier: is your update PUT or PATCH, and what happens to fields I do not send?</text></svg>