e="16" font-weight="700" fill="#1a2420">SaaS</text><rect x="575" y="75" width="150" height="52" rx="0" fill="#f3f4f3" stroke="#c9d4cf" stroke-width="1.5"/><text x="650.0" y="105.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">Application &amp; data</text><text x="650" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5550">Supplier</text><rect x="575" y="137" width="150" height="52" rx="0" fill="#f3f4f3" stroke="#c9d4cf" stroke-width="1.5"/><text x="650.0" y="167.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">Runtime / operating system</text><text x="650" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5550">Supplier</text><rect x="575" y="199" width="150" height="52" rx="0" fill="#f3f4f3" stroke="#c9d4cf" stroke-width="1.5"/><text x="650.0" y="229.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">Servers, storage, network</text><text x="650" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#4a5550">Supplier</text><text x="380" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Moving right means the supplier does more, and you control (and worry about) less.</text><text x="380" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Most council systems you will meet today are SaaS: you log in, the supplier runs everything else.</text></svg>