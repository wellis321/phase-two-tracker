<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="A request travels through the layers of a digital service and the answer travels back"><title>A request travels through the layers of a digital service and the answer travels back</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}2%{opacity:0}3.5%{opacity:0.16}10%{opacity:0.16}11.5%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}11.5%{opacity:0}13%{opacity:0.16}19.5%{opacity:0.16}21%{opacity:0}100%{opacity:0}}@keyframes hl3{0%{opacity:0}21%{opacity:0}22.5%{opacity:0.16}29%{opacity:0.16}30.5%{opacity:0}100%{opacity:0}}@keyframes hl4{0%{opacity:0}30.5%{opacity:0}32%{opacity:0.16}38.5%{opacity:0.16}40%{opacity:0}100%{opacity:0}}@keyframes hl5{0%{opacity:0}40%{opacity:0}41.5%{opacity:0.16}48%{opacity:0.16}49.5%{opacity:0}100%{opacity:0}}@keyframes mv6{0%{opacity:0;transform:translate(80px,66px)}5.95%{opacity:0;transform:translate(80px,66px)}6%{opacity:1;transform:translate(80px,66px)}15.5%{opacity:1;transform:translate(220px,66px)}25%{opacity:1;transform:translate(360px,66px)}34.5%{opacity:1;transform:translate(500px,66px)}44%{opacity:1;transform:translate(640px,66px)}44.8%{opacity:0;transform:translate(640px,66px)}100%{opacity:0;transform:translate(640px,66px)}}@keyframes mv7{0%{opacity:0;transform:translate(640px,214px)}51.95%{opacity:0;transform:translate(640px,214px)}52%{opacity:1;transform:translate(640px,214px)}61.5%{opacity:1;transform:translate(500px,214px)}71%{opacity:1;transform:translate(360px,214px)}80.5%{opacity:1;transform:translate(220px,214px)}90%{opacity:1;transform:translate(80px,214px)}90.8%{opacity:0;transform:translate(80px,214px)}100%{opacity:0;transform:translate(80px,214px)}}@keyframes lb8{0%{opacity:0}5%{opacity:0}6%{opacity:1}46%{opacity:1}47%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}51%{opacity:0}52%{opacity:1}92%{opacity:1}93%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="340" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">What happens when a tenant reports a repair online</text><polyline points="80,66 640,66" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="640,214 80,214" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="90" width="120" height="100" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="80.0" y="124.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Person</text><text x="80.0" y="145.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">A tenant on</text><text x="80.0" y="166.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">their phone</text><rect class="hl" x="20" y="90" width="120" height="100" fill="#006A51" style="opacity:0;animation:hl1 10s linear infinite"/><rect x="160" y="90" width="120" height="100" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="220.0" y="124.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Front end</text><text x="220.0" y="145.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">The screen</text><text x="220.0" y="166.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">they see</text><rect class="hl" x="160" y="90" width="120" height="100" fill="#006A51" style="opacity:0;animation:hl2 10s linear infinite"/><rect x="300" y="90" width="120" height="100" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="360.0" y="124.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">API</text><text x="360.0" y="145.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">The messenger</text><text x="360.0" y="166.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">between parts</text><rect class="hl" x="300" y="90" width="120" height="100" fill="#006A51" style="opacity:0;animation:hl3 10s linear infinite"/><rect x="440" y="90" width="120" height="100" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="500.0" y="124.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Back end</text><text x="500.0" y="145.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Rules and logic</text><text x="500.0" y="166.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">"is it urgent?"</text><rect class="hl" x="440" y="90" width="120" height="100" fill="#006A51" style="opacity:0;animation:hl4 10s linear infinite"/><rect x="580" y="90" width="120" height="100" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="640.0" y="124.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Database</text><text x="640.0" y="145.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Where repair</text><text x="640.0" y="166.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">records live</text><rect class="hl" x="580" y="90" width="120" height="100" fill="#006A51" style="opacity:0;animation:hl5 10s linear infinite"/><g class="dot" style="opacity:0;animation:mv6 10s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv7 10s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb8 10s linear infinite">The tenant taps "Report a repair". The request passes through every layer.</text><text class="lab slot" x="380" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb9 10s linear infinite">The answer comes back the same way: "Your reference is R-4821".</text><text x="380" y="296" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Front end = what you see.   Back end = what you do not.</text><text x="380" y="318" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Servers and the internet carry every one of these messages.</text></svg>