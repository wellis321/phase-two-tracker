<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Layers of a digital service: person, front end, API, back end, database" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="310" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">What happens when a tenant reports a repair online</text><rect x="20" y="70" width="120" height="90" rx="0" fill="#fff" stroke="#4a5550" stroke-width="1.5"/><text x="80.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Person</text><text x="80.0" y="120.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">A tenant on</text><text x="80.0" y="140.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">their phone</text><line x1="143" y1="115" x2="157" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><rect x="160" y="70" width="120" height="90" rx="0" fill="#fff" stroke="#006A51" stroke-width="1.5"/><text x="220.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Front end</text><text x="220.0" y="120.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">The screen</text><text x="220.0" y="140.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">they see</text><line x1="283" y1="115" x2="297" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><rect x="300" y="70" width="120" height="90" rx="0" fill="#fff" stroke="#4f9c88" stroke-width="1.5"/><text x="360.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">API</text><text x="360.0" y="120.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">The messenger</text><text x="360.0" y="140.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">between parts</text><line x1="423" y1="115" x2="437" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><rect x="440" y="70" width="120" height="90" rx="0" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="500.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Back end</text><text x="500.0" y="120.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Rules &amp; logic</text><text x="500.0" y="140.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">"is it urgent?"</text><line x1="563" y1="115" x2="577" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><rect x="580" y="70" width="120" height="90" rx="0" fill="#fff" stroke="#5d6b66" stroke-width="1.5"/><text x="640.0" y="100.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Database</text><text x="640.0" y="120.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Where repair</text><text x="640.0" y="140.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">records live</text><rect x="150" y="200" width="270" height="30" rx="0" fill="#e6f2ee"/><text x="285" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51">Front end = what you see</text><rect x="430" y="200" width="270" height="30" rx="0" fill="#f7f8f7"/><text x="565" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Back end = what you don't see</text><text x="380" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">All of it travels over the internet and runs on servers (computers someone else looks after).</text><text x="380" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Arrows go both ways: every request gets a response.</text></svg>