<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Two withdrawals at once: without protection both succeed and the account is overdrawn; with a lock the second is declined"><title>Two withdrawals at once: without protection both succeed and the account is overdrawn; with a lock the second is declined</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes fd1{0%{opacity:1}29%{opacity:1}30%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:1}100%{opacity:1}}@keyframes fd2{0%{opacity:0}29%{opacity:0}30%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes fd3{0%{opacity:1}23%{opacity:1}24%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:1}100%{opacity:1}}@keyframes fd4{0%{opacity:0}23%{opacity:0}24%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes mv5{0%{opacity:0;transform:translate(95px,248px)}4.95%{opacity:0;transform:translate(95px,248px)}5%{opacity:1;transform:translate(95px,248px)}16%{opacity:1;transform:translate(210px,150px)}16.8%{opacity:0;transform:translate(210px,150px)}100%{opacity:0;transform:translate(210px,150px)}}@keyframes mv6{0%{opacity:0;transform:translate(275px,248px)}5.95%{opacity:0;transform:translate(275px,248px)}6%{opacity:1;transform:translate(275px,248px)}17%{opacity:1;transform:translate(250px,150px)}17.8%{opacity:0;transform:translate(250px,150px)}100%{opacity:0;transform:translate(250px,150px)}}@keyframes mv7{0%{opacity:0;transform:translate(210px,150px)}21.95%{opacity:0;transform:translate(210px,150px)}22%{opacity:1;transform:translate(210px,150px)}31%{opacity:1;transform:translate(95px,248px)}31.8%{opacity:0;transform:translate(95px,248px)}100%{opacity:0;transform:translate(95px,248px)}}@keyframes mv8{0%{opacity:0;transform:translate(250px,150px)}22.95%{opacity:0;transform:translate(250px,150px)}23%{opacity:1;transform:translate(250px,150px)}32%{opacity:1;transform:translate(275px,248px)}32.8%{opacity:0;transform:translate(275px,248px)}100%{opacity:0;transform:translate(275px,248px)}}@keyframes lb9{0%{opacity:0}4%{opacity:0}5%{opacity:1}20%{opacity:1}21%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}21%{opacity:0}22%{opacity:1}36%{opacity:1}37%{opacity:0}100%{opacity:0}}@keyframes lb11{0%{opacity:0}38%{opacity:0}39%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}@keyframes hl12{0%{opacity:0}4%{opacity:0}5.5%{opacity:0.3}24%{opacity:0.3}25.5%{opacity:0}100%{opacity:0}}@keyframes mv13{0%{opacity:0;transform:translate(465px,248px)}4.95%{opacity:0;transform:translate(465px,248px)}5%{opacity:1;transform:translate(465px,248px)}14%{opacity:1;transform:translate(580px,150px)}14.8%{opacity:0;transform:translate(580px,150px)}100%{opacity:0;transform:translate(580px,150px)}}@keyframes mv14{0%{opacity:0;transform:translate(580px,150px)}16.95%{opacity:0;transform:translate(580px,150px)}17%{opacity:1;transform:translate(580px,150px)}25%{opacity:1;transform:translate(465px,248px)}25.8%{opacity:0;transform:translate(465px,248px)}100%{opacity:0;transform:translate(465px,248px)}}@keyframes mv15{0%{opacity:0;transform:translate(645px,248px)}35.95%{opacity:0;transform:translate(645px,248px)}36%{opacity:1;transform:translate(645px,248px)}44%{opacity:1;transform:translate(620px,150px)}44.8%{opacity:0;transform:translate(620px,150px)}100%{opacity:0;transform:translate(620px,150px)}}@keyframes mv16{0%{opacity:0;transform:translate(620px,150px)}46.95%{opacity:0;transform:translate(620px,150px)}47%{opacity:1;transform:translate(620px,150px)}55%{opacity:1;transform:translate(645px,248px)}55.8%{opacity:0;transform:translate(645px,248px)}100%{opacity:0;transform:translate(645px,248px)}}@keyframes lb17{0%{opacity:0}3%{opacity:0}4%{opacity:1}17%{opacity:1}18%{opacity:0}100%{opacity:0}}@keyframes lb18{0%{opacity:0}18%{opacity:0}19%{opacity:1}34%{opacity:1}35%{opacity:0}100%{opacity:0}}@keyframes lb19{0%{opacity:0}35%{opacity:0}36%{opacity:1}56%{opacity:1}57%{opacity:0}100%{opacity:0}}@keyframes lb20{0%{opacity:0}58%{opacity:0}59%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="440" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">A race condition, and how it is prevented</text><text x="185" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Without protection</text><rect x="105" y="84" width="160" height="64" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="185" y="106" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Account balance</text><g class="fd" style="animation:fd1 14s linear infinite"><text x="185" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2420">£100</text></g><g class="fd" style="animation:fd2 14s linear infinite"><text x="185" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#006A51">£20</text></g><rect x="25" y="250" width="140" height="56" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="95.0" y="273.45" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Customer A</text><text x="95.0" y="291.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">withdraws £80</text><rect x="205" y="250" width="140" height="56" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="275.0" y="273.45" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Customer B</text><text x="275.0" y="291.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">withdraws £80</text><text x="555" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#006A51">With a lock / transaction</text><rect x="475" y="84" width="160" height="64" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="555" y="106" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Account balance</text><g class="fd" style="animation:fd3 14s linear infinite"><text x="555" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2420">£100</text></g><g class="fd" style="animation:fd4 14s linear infinite"><text x="555" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#006A51">£20</text></g><rect x="395" y="250" width="140" height="56" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="465.0" y="273.45" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Customer A</text><text x="465.0" y="291.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">withdraws £80</text><rect x="575" y="250" width="140" height="56" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="645.0" y="273.45" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Customer B</text><text x="645.0" y="291.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">withdraws £80</text><g class="dot" style="opacity:0;animation:mv5 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv6 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">B</text></g><g class="dot" style="opacity:0;animation:mv7 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv8 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">B</text></g><text class="lab slot" x="185" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb9 14s linear infinite">1. Both read £100 at the same moment</text><text class="lab slot" x="185" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 14s linear infinite">2. Both write back £20</text><text class="lab slot" x="185" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb11 14s linear infinite">Both succeed: £160 paid out from £100</text><rect class="hl" x="475" y="84" width="160" height="64" fill="#006A51" style="opacity:0;animation:hl12 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv13 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv14 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv15 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">B</text></g><g class="dot" style="opacity:0;animation:mv16 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/><text x="0" y="3.2399999999999998" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">B</text></g><text class="lab slot" x="555" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#006A51" style="opacity:0;animation:lb17 14s linear infinite">1. A locks the balance and reads £100</text><text class="lab slot" x="555" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#006A51" style="opacity:0;animation:lb18 14s linear infinite">2. B has to wait its turn</text><text class="lab slot" x="555" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#006A51" style="opacity:0;animation:lb19 14s linear infinite">3. B now reads £20: declined</text><text class="lab slot" x="555" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#006A51" style="opacity:0;animation:lb20 14s linear infinite">Money stays correct</text><text x="380" y="405" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">A race condition is when the result depends on which of two actions happens to get there first.</text><text x="380" y="427" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">It works perfectly in testing with one user, then fails once in a million with many.</text></svg>