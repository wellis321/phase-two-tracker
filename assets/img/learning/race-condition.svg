1.5"/><text x="195" y="116" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Tuesday 10:00 slot</text><rect x="40" y="215" width="150" height="54" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="115.0" y="237.45000000000002" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Planner A</text><text x="115.0" y="255.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">books the slot</text><rect x="200" y="215" width="150" height="54" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="275.0" y="237.45000000000002" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Planner B</text><text x="275.0" y="255.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">books the slot</text><polyline points="115,213 140,168" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="275,213 250,168" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="35" y="300" width="320" height="86" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><rect x="390" y="50" width="350" height="350" fill="#fff" stroke="#c9d4cf" stroke-width="1.5"/><text x="565" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#006A51">With a lock</text><rect x="465" y="94" width="200" height="70" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="565" y="116" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Tuesday 10:00 slot</text><rect x="410" y="215" width="150" height="54" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="485.0" y="237.45000000000002" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Planner A</text><text x="485.0" y="255.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">books the slot</text><rect x="570" y="215" width="150" height="54" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="645.0" y="237.45000000000002" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Planner B</text><text x="645.0" y="255.65" text-anchor="middle" font-size="11" font-weight="400" fill="#1a2420">books the slot</text><polyline points="485,213 510,168" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="645,213 620,168" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="405" y="300" width="320" height="86" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><g class="fd" style="animation:fd1 14s linear infinite"><text x="195" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2420">1 slot free</text></g><g class="fd" style="animation:fd2 14s linear infinite"><text x="195" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2420">BOOKED TWICE</text></g><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#006A51"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv4 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#1a2420"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">B</text></g><g class="dot" style="opacity:0;animation:mv5 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#006A51"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv6 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#1a2420"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">B</text></g><text class="lab slot" x="195" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb7 14s linear infinite">1. Both look: one slot is free</text><text class="lab slot" x="195" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb8 14s linear infinite">Neither can see the other looking</text><text class="lab slot" x="195" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb9 14s linear infinite">2. Both press Book together</text><text class="lab slot" x="195" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb10 14s linear infinite">Each still believes the slot is free</text><text class="lab slot" x="195" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb11 14s linear infinite">3. The slot is booked twice</text><text class="lab slot" x="195" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb12 14s linear infinite">Two operatives turn up. Nobody erred.</text><g class="fd" style="animation:fd13 14s linear infinite"><text x="565" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2420">1 slot free</text></g><g class="fd" style="animation:fd14 14s linear infinite"><text x="565" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#006A51">Locked by A</text></g><g class="fd" style="animation:fd15 14s linear infinite"><text x="565" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#006A51">Booked by A</text></g><g class="fd" style="animation:fd16 14s linear infinite"><text x="565" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51">Taken: B must pick another</text></g><rect class="hl" x="465" y="94" width="200" height="70" fill="#006A51" style="opacity:0;animation:hl17 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv18 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#006A51"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv19 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#006A51"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">A</text></g><g class="dot" style="opacity:0;animation:mv20 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#1a2420"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">B</text></g><g class="dot" style="opacity:0;animation:mv21 14s linear infinite"><rect x="-8.0" y="-8.0" width="16" height="16" fill="#1a2420"/><text x="0" y="3.5999999999999996" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">B</text></g><text class="lab slot" x="565" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb22 14s linear infinite">1. A looks, locks the slot, books it</text><text class="lab slot" x="565" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb23 14s linear infinite">B has to wait while A is working</text><text class="lab slot" x="565" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb24 14s linear infinite">2. A has finished: slot booked</text><text class="lab slot" x="565" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb25 14s linear infinite">The lock is released</text><text class="lab slot" x="565" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb26 14s linear infinite">3. B looks: the slot is taken</text><text class="lab slot" x="565" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb27 14s linear infinite">B is offered another time</text><text class="lab slot" x="565" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb28 14s linear infinite">Result: one booking, no clash</text><text class="lab slot" x="565" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb29 14s linear infinite">Checking and booking were one step</text><text x="380" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">A race condition: the result depends on which action gets there first.</text><text x="380" y="452" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">It works in testing with one user, then fails now and then with many.</text></svg>