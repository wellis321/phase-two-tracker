<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="The reuse ladder: from writing everything from scratch to buying a finished service"><title>The reuse ladder: from writing everything from scratch to buying a finished service</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="340" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Build or reuse? The more you reuse, the less you control</text><rect x="30" y="60" width="400" height="40" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="42" y="77" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">A programming language</text><text x="42" y="93" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">PHP, JavaScript, Python: you write everything</text><rect x="30" y="110" width="450" height="40" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="42" y="127" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">Libraries</text><text x="42" y="143" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">Ready-made code for one job, such as dates or charts</text><rect x="30" y="160" width="520" height="40" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="42" y="177" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">Frameworks</text><text x="42" y="193" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">A structure to build inside: React, Laravel, Django</text><rect x="30" y="210" width="590" height="40" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="42" y="227" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">CMS and platforms</text><text x="42" y="243" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">WordPress, Drupal: most of the site already exists</text><rect x="30" y="260" width="700" height="40" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="42" y="277" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">Finished SaaS product</text><text x="42" y="293" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">Configure and use: the supplier runs everything</text><text x="30" y="325" text-anchor="start" font-size="12" font-weight="400" fill="#4a5550">Longer bar = more of the work is done for you.  Lower down = less control, less effort, faster start.</text></svg>