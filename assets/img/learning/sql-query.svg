r="start" font-size="13" font-weight="400" fill="#e6edf3" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SELECT id, address FROM repairs WHERE status = 'open' AND priority = 'emergency';</text><rect x="40" y="130" width="80" height="30" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="149.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">id</text><rect x="120" y="130" width="150" height="30" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="149.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">priority</text><rect x="270" y="130" width="130" height="30" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="280" y="149.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">status</text><rect x="40" y="160" width="80" height="30" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">4821</text><rect x="120" y="160" width="150" height="30" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">emergency</text><rect x="270" y="160" width="130" height="30" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="280" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">open</text><rect class="hl" x="40" y="160" width="360" height="30" fill="#006A51" style="opacity:0;animation:hl1 14s linear infinite"/><rect x="40" y="190" width="80" height="30" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="209.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">4822</text><rect x="120" y="190" width="150" height="30" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="209.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">routine</text><rect x="270" y="190" width="130" height="30" fill="#fff" stroke="#c9