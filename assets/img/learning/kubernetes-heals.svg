<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Kubernetes notices a failed container and starts a replacement so the right number keep running"><title>Kubernetes notices a failed container and starts a replacement so the right number keep running</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes fd1{0%{opacity:1}32%{opacity:1}34%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:1}100%{opacity:1}}@keyframes fd2{0%{opacity:0}32%{opacity:0}34%{opacity:1}46%{opacity:1}48%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:0}100%{opacity:0}}@keyframes fd3{0%{opacity:0}52%{opacity:0}55%{opacity:1}93%{opacity:1}94%{opacity:1}95.5%{opacity:0}100%{opacity:0}}@keyframes mv4{0%{opacity:0;transform:translate(380px,250px)}49.95%{opacity:0;transform:translate(380px,250px)}50%{opacity:1;transform:translate(380px,250px)}56%{opacity:1;transform:translate(380px,232px)}56.8%{opacity:0;transform:translate(380px,232px)}100%{opacity:0;transform:translate(380px,232px)}}@keyframes lb5{0%{opacity:0}3%{opacity:0}4%{opacity:1}30%{opacity:1}31%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}31%{opacity:0}32%{opacity:1}47%{opacity:1}48%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}48%{opacity:0}49%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="340" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Kubernetes: keeping the right number of copies running</text><rect x="30" y="80" width="220" height="150" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="140" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Server 1</text><rect x="270" y="80" width="220" height="150" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="380" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Server 2</text><rect x="510" y="80" width="220" height="150" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="620" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Server 3</text><rect x="50" y="130" width="180" height="44" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="140" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Repairs app (copy 1)</text><rect x="290" y="130" width="180" height="44" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Repairs app (copy 3)</text><g class="fd" style="animation:fd1 12s linear infinite"><rect x="530" y="130" width="180" height="44" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="620" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">Repairs app (copy 2)</text></g><g class="fd" style="animation:fd2 12s linear infinite"><rect x="530" y="130" width="180" height="44" fill="#eceeed" stroke="#4a5550" stroke-width="1.5"/><text x="620" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5550">Server 3 has failed</text></g><g class="fd" style="animation:fd3 12s linear infinite"><rect x="290" y="182" width="180" height="44" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="380" y="209" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">New copy 2 (started)</text></g><rect x="270" y="250" width="220" height="50" fill="#006A51"/><text x="380" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Kubernetes</text><text x="380" y="290" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">told: "always run 3 copies"</text><g class="dot" style="opacity:0;animation:mv4 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb5 12s linear infinite">Kubernetes is told: always keep three copies of the repairs app running</text><text class="lab slot" x="380" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 12s linear infinite">A server fails in the night, taking its copy with it</text><text class="lab slot" x="380" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 12s linear infinite">Kubernetes notices and starts a replacement on its own: no one is paged</text></svg>