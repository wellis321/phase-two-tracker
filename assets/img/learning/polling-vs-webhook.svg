<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Polling means repeatedly asking for news, a webhook means being told once when something happens"><title>Polling means repeatedly asking for news, a webhook means being told once when something happens</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(210px,105px)}2.95%{opacity:0;transform:translate(210px,105px)}3%{opacity:1;transform:translate(210px,105px)}10%{opacity:1;transform:translate(550px,105px)}10.8%{opacity:0;transform:translate(550px,105px)}100%{opacity:0;transform:translate(550px,105px)}}@keyframes mv2{0%{opacity:0;transform:translate(550px,135px)}10.95%{opacity:0;transform:translate(550px,135px)}11%{opacity:1;transform:translate(550px,135px)}18%{opacity:1;transform:translate(210px,135px)}18.8%{opacity:0;transform:translate(210px,135px)}100%{opacity:0;transform:translate(210px,135px)}}@keyframes mv3{0%{opacity:0;transform:translate(210px,105px)}23.95%{opacity:0;transform:translate(210px,105px)}24%{opacity:1;transform:translate(210px,105px)}31%{opacity:1;transform:translate(550px,105px)}31.8%{opacity:0;transform:translate(550px,105px)}100%{opacity:0;transform:translate(550px,105px)}}@keyframes mv4{0%{opacity:0;transform:translate(550px,135px)}31.95%{opacity:0;transform:translate(550px,135px)}32%{opacity:1;transform:translate(550px,135px)}39%{opacity:1;transform:translate(210px,135px)}39.8%{opacity:0;transform:translate(210px,135px)}100%{opacity:0;transform:translate(210px,135px)}}@keyframes mv5{0%{opacity:0;transform:translate(210px,105px)}44.95%{opacity:0;transform:translate(210px,105px)}45%{opacity:1;transform:translate(210px,105px)}52%{opacity:1;transform:translate(550px,105px)}52.8%{opacity:0;transform:translate(550px,105px)}100%{opacity:0;transform:translate(550px,105px)}}@keyframes mv6{0%{opacity:0;transform:translate(550px,135px)}52.95%{opacity:0;transform:translate(550px,135px)}53%{opacity:1;transform:translate(550px,135px)}60%{opacity:1;transform:translate(210px,135px)}60.8%{opacity:0;transform:translate(210px,135px)}100%{opacity:0;transform:translate(210px,135px)}}@keyframes lb7{0%{opacity:0}3%{opacity:0}4%{opacity:1}62%{opacity:1}63%{opacity:0}100%{opacity:0}}@keyframes mv8{0%{opacity:0;transform:translate(550px,290px)}63.95%{opacity:0;transform:translate(550px,290px)}64%{opacity:1;transform:translate(550px,290px)}80%{opacity:1;transform:translate(210px,290px)}80.8%{opacity:0;transform:translate(210px,290px)}100%{opacity:0;transform:translate(210px,290px)}}@keyframes hl9{0%{opacity:0}80%{opacity:0}81.5%{opacity:0.16}95%{opacity:0.16}96.5%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}82%{opacity:0}83%{opacity:1}97%{opacity:1}98%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="400" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Polling versus webhooks</text><text x="380" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Polling: keep asking</text><rect x="20" y="85" width="150" height="70" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="95.0" y="124.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Council system</text><rect x="590" y="85" width="150" height="70" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="665.0" y="124.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Contractor system</text><polyline points="172,105 588,105" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="588,135 174,135" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><g class="dot" style="opacity:0;animation:mv1 14s linear infinite"><rect x="-39.0" y="-11.0" width="78" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Done yet?</text></g><g class="dot" style="opacity:0;animation:mv2 14s linear infinite"><rect x="-39.0" y="-11.0" width="78" height="22" fill="#1a2420"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Not yet</text></g><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-39.0" y="-11.0" width="78" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Done yet?</text></g><g class="dot" style="opacity:0;animation:mv4 14s linear infinite"><rect x="-39.0" y="-11.0" width="78" height="22" fill="#1a2420"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Not yet</text></g><g class="dot" style="opacity:0;animation:mv5 14s linear infinite"><rect x="-39.0" y="-11.0" width="78" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Done yet?</text></g><g class="dot" style="opacity:0;animation:mv6 14s linear infinite"><rect x="-39.0" y="-11.0" width="78" height="22" fill="#006A51"/><text x="0" y="3.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Yes!</text></g><text x="380" y="182" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Lots of messages, and the answer may be old by the time it arrives.</text><text x="380" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Webhook: tell me when it happens</text><rect x="20" y="255" width="150" height="70" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="95.0" y="294.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Council system</text><rect x="590" y="255" width="150" height="70" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="665.0" y="294.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Contractor system</text><polyline points="588,290 174,290" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><text class="lab slot" x="380" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5550" style="opacity:0;animation:lb7 14s linear infinite">Waiting quietly. Nothing is sent.</text><g class="dot" style="opacity:0;animation:mv8 14s linear infinite"><rect x="-56.0" y="-12.0" width="112" height="24" fill="#006A51"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Job complete!</text></g><rect class="hl" x="20" y="255" width="150" height="70" fill="#006A51" style="opacity:0;animation:hl9 14s linear infinite"/><text class="lab slot" x="380" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb10 14s linear infinite">One message, sent the moment it happens.</text><text x="380" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Use polling when "every 15 minutes" is fine. Use a webhook when real time matters.</text></svg>