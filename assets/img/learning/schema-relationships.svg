<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="A database schema: four linked tables for properties, tenants, repairs and contractors"><title>A database schema: four linked tables for properties, tenants, repairs and contractors</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}8%{opacity:0}9.5%{opacity:0.28}22%{opacity:0.28}23.5%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}30%{opacity:0}31.5%{opacity:0.2}48%{opacity:0.2}49.5%{opacity:0}100%{opacity:0}}@keyframes mv3{0%{opacity:0;transform:translate(520px,237px)}23.95%{opacity:0;transform:translate(520px,237px)}24%{opacity:1;transform:translate(520px,237px)}34.88%{opacity:1;transform:translate(600px,237px)}44%{opacity:1;transform:translate(600px,170px)}44.8%{opacity:0;transform:translate(600px,170px)}100%{opacity:0;transform:translate(600px,170px)}}@keyframes lb4{0%{opacity:0}4%{opacity:0}5%{opacity:1}24%{opacity:1}25%{opacity:0}100%{opacity:0}}@keyframes lb5{0%{opacity:0}25%{opacity:0}26%{opacity:1}52%{opacity:1}53%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}54%{opacity:0}55%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="450" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">A schema: the blueprint of the tables and how they link</text><rect x="30" y="60" width="210" height="108" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="30" y="60" width="210" height="30" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="135.0" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">properties</text><text x="42" y="108" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">uprn</text><text x="230" y="108" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">KEY</text><text x="42" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">address</text><text x="42" y="160" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">postcode</text><rect x="30" y="250" width="210" height="108" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="30" y="250" width="210" height="30" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="135.0" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">tenants</text><text x="42" y="298" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">id</text><text x="230" y="298" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">KEY</text><text x="42" y="324" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">name</text><text x="42" y="350" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">uprn</text><text x="230" y="350" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">LINK</text><rect x="300" y="150" width="220" height="160" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="300" y="150" width="220" height="30" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="410.0" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">repairs</text><text x="312" y="198" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">id</text><text x="510" y="198" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">KEY</text><text x="312" y="224" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">uprn</text><text x="510" y="224" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">LINK</text><text x="312" y="250" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">contractor_id</text><text x="510" y="250" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">LINK</text><text x="312" y="276" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">priority</text><text x="312" y="302" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">status</text><rect x="560" y="60" width="180" height="108" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="560" y="60" width="180" height="30" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="650.0" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">contractors</text><text x="572" y="108" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">id</text><text x="730" y="108" text-anchor="end" font-size="11" font-weight="700" fill="#006A51">KEY</text><text x="572" y="134" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">name</text><text x="572" y="160" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">trade</text><polyline points="240,110 300,215" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="262" y="150" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">1 : many</text><polyline points="135,168 135,248" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="143" y="212" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">1 : many</text><polyline points="650,168 650,232 520,232" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="660" y="205" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">1 : many</text><rect class="hl" x="300" y="224" width="220" height="26" fill="#006A51" style="opacity:0;animation:hl1 14s linear infinite"/><rect class="hl" x="560" y="60" width="180" height="108" fill="#006A51" style="opacity:0;animation:hl2 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb4 14s linear infinite">Repair 4821 stores only a number: contractor_id = 7</text><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb5 14s linear infinite">The database follows the link to contractor 7 and finds the name and trade</text><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 14s linear infinite">Nothing is copied: the contractor is stored once and linked from every repair</text><text x="380" y="430" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">KEY = unique label for a row.   LINK = holds the key of a row in another table.</text></svg>