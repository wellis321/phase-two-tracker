<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Five common types of database: relational, document, key-value, graph and time-series"><title>Five common types of database: relational, document, key-value, graph and time-series</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="400" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Choosing a database: five common types</text><rect x="20" y="60" width="138" height="300" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="20" y="60" width="138" height="34" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="89" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Relational</text><text x="89" y="114" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">Tables that link</text><rect x="44" y="140" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="74" y="140" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="104" y="140" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="44" y="158" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="74" y="158" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="104" y="158" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="44" y="176" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="74" y="176" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="104" y="176" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="44" y="194" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="74" y="194" width="30" height="18" fill="#fff" stroke="#006A51"/><rect x="104" y="194" width="30" height="18" fill="#fff" stroke="#006A51"/><text x="89" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">Repairs, tenants,</text><text x="89" y="261" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">invoices:</text><text x="89" y="277" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">structured,</text><text x="89" y="293" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">linked, must be</text><text x="89" y="309" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">exact</text><rect x="166" y="60" width="138" height="300" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="166" y="60" width="138" height="34" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="235" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Document</text><text x="235" y="114" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">Flexible JSON records</text><rect x="188" y="140" width="94" height="40" fill="#fff" stroke="#006A51"/><rect x="194" y="158" width="82" height="40" fill="#fff" stroke="#006A51"/><rect x="200" y="176" width="70" height="40" fill="#fff" stroke="#006A51"/><text x="235" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">{ ... }</text><text x="235" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">Survey answers or</text><text x="235" y="261" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">forms where each</text><text x="235" y="277" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">record differs</text><rect x="312" y="60" width="138" height="300" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="312" y="60" width="138" height="34" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="381" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Key-value</text><text x="381" y="114" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">Look up by name, fast</text><rect x="328" y="140" width="42" height="20" fill="#e6f2ee" stroke="#006A51"/><rect x="390" y="140" width="44" height="20" fill="#fff" stroke="#006A51"/><polyline points="372,150 388,150" fill="none" stroke="#006A51" stroke-width="2" marker-end="url(#ah)"/><rect x="328" y="164" width="42" height="20" fill="#e6f2ee" stroke="#006A51"/><rect x="390" y="164" width="44" height="20" fill="#fff" stroke="#006A51"/><polyline points="372,174 388,174" fill="none" stroke="#006A51" stroke-width="2" marker-end="url(#ah)"/><rect x="328" y="188" width="42" height="20" fill="#e6f2ee" stroke="#006A51"/><rect x="390" y="188" width="44" height="20" fill="#fff" stroke="#006A51"/><polyline points="372,198 388,198" fill="none" stroke="#006A51" stroke-width="2" marker-end="url(#ah)"/><text x="381" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">Login sessions</text><text x="381" y="261" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">and caches: "give</text><text x="381" y="277" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">me item 91827"</text><rect x="458" y="60" width="138" height="300" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="458" y="60" width="138" height="34" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="527" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Graph</text><text x="527" y="114" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">Things and their links</text><polyline points="527,145 486,185" fill="none" stroke="#006A51" stroke-width="1.5"/><polyline points="527,145 568,185" fill="none" stroke="#006A51" stroke-width="1.5"/><polyline points="486,185 527,205" fill="none" stroke="#006A51" stroke-width="1.5"/><polyline points="568,185 527,205" fill="none" stroke="#006A51" stroke-width="1.5"/><polyline points="486,185 568,185" fill="none" stroke="#006A51" stroke-width="1.5"/><rect x="519" y="137" width="16" height="16" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><rect x="478" y="177" width="16" height="16" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><rect x="560" y="177" width="16" height="16" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><rect x="519" y="197" width="16" height="16" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="527" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">Who is connected</text><text x="527" y="261" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">to what, and how</text><rect x="604" y="60" width="138" height="300" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><rect x="604" y="60" width="138" height="34" fill="#e6f2ee" stroke="#1a2420" stroke-width="1.5"/><text x="673" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Time-series</text><text x="673" y="114" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">Values over time</text><polyline points="622,205 622,138" fill="none" stroke="#4a5550" stroke-width="1.5"/><polyline points="622,205 726,205" fill="none" stroke="#4a5550" stroke-width="1.5"/><polyline points="626,190 648,175 670,183 692,155 722,162" fill="none" stroke="#006A51" stroke-width="2.5"/><text x="673" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">Damp and</text><text x="673" y="261" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">temperature</text><text x="673" y="277" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1a2420">sensor readings</text><text x="380" y="385" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Most systems use more than one: the right tool for each job.</text></svg>