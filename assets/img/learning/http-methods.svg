<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="GET, POST, PUT, PATCH and DELETE with repairs examples" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="360" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">The five HTTP methods you will hear most</text><rect x="20" y="55" width="720" height="50" rx="0" fill="#fff" stroke="#c9d4cf"/><rect x="20" y="55" width="110" height="50" rx="0" fill="#006A51"/><text x="75" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GET</text><text x="150" y="86" text-anchor="start" font-size="15" font-weight="700" fill="#1a2420">Read</text><text x="265" y="86" text-anchor="start" font-size="14" font-weight="400" fill="#4a5550">"Show me repair 4821"</text><text x="730" y="86" text-anchor="end" font-size="12" font-weight="700" fill="#006A51">Safe: changes nothing</text><rect x="20" y="115" width="720" height="50" rx="0" fill="#fff" stroke="#c9d4cf"/><rect x="20" y="115" width="110" height="50" rx="0" fill="#d9822b"/><text x="75" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">POST</text><text x="150" y="146" text-anchor="start" font-size="15" font-weight="700" fill="#1a2420">Create</text><text x="265" y="146" text-anchor="start" font-size="14" font-weight="400" fill="#4a5550">"Log a new repair"</text><text x="730" y="146" text-anchor="end" font-size="12" font-weight="700" fill="#d9822b">Makes a new thing each time</text><rect x="20" y="175" width="720" height="50" rx="0" fill="#fff" stroke="#c9d4cf"/><rect x="20" y="175" width="110" height="50" rx="0" fill="#3b6ea8"/><text x="75" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PUT</text><text x="150" y="206" text-anchor="start" font-size="15" font-weight="700" fill="#1a2420">Replace</text><text x="265" y="206" text-anchor="start" font-size="14" font-weight="400" fill="#4a5550">"Here is the whole record, swap it in"</text><text x="730" y="206" text-anchor="end" font-size="12" font-weight="700" fill="#3b6ea8">Replaces everything</text><rect x="20" y="235" width="720" height="50" rx="0" fill="#fff" stroke="#c9d4cf"/><rect x="20" y="235" width="110" height="50" rx="0" fill="#6b5b95"/><text x="75" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PATCH</text><text x="150" y="266" text-anchor="start" font-size="15" font-weight="700" fill="#1a2420">Update part</text><text x="265" y="266" text-anchor="start" font-size="14" font-weight="400" fill="#4a5550">"Just change the priority to Urgent"</text><text x="730" y="266" text-anchor="end" font-size="12" font-weight="700" fill="#6b5b95">Changes only what you send</text><rect x="20" y="295" width="720" height="50" rx="0" fill="#fff" stroke="#c9d4cf"/><rect x="20" y="295" width="110" height="50" rx="0" fill="#b91c1c"/><text x="75" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">DELETE</text><text x="150" y="326" text-anchor="start" font-size="15" font-weight="700" fill="#1a2420">Remove</text><text x="265" y="326" text-anchor="start" font-size="14" font-weight="400" fill="#4a5550">"Cancel repair 4821"</text><text x="730" y="326" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">Removes it</text></svg>