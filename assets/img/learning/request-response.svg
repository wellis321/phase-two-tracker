<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 275" role="img" aria-label="A client sends a request to a server and gets a response" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="275" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">The request-response conversation</text><rect x="30" y="70" width="170" height="110" rx="0" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="115.0" y="110.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Client</text><text x="115.0" y="130.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">(your browser or an app)</text><text x="115.0" y="150.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">"the one asking"</text><rect x="560" y="70" width="170" height="110" rx="0" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="645.0" y="110.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Server</text><text x="645.0" y="130.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">(a computer somewhere)</text><text x="645.0" y="150.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">"the one answering"</text><line x1="205" y1="100" x2="555" y2="100" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><text x="380" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51">REQUEST</text><text x="380" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">GET /repairs/4821  (please show me repair 4821)</text><line x1="555" y1="150" x2="205" y2="150" stroke="#1a2420" stroke-width="2" marker-end="url(#a)"/><text x="380" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420">RESPONSE</text><text x="380" y="170" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">200 OK  +  the repair details</text><text x="380" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Every click, every page, every app screen is one of these conversations.</text><text x="380" y="252" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">The web is just millions of them happening every second.</text></svg>