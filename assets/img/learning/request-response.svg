<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="A client sends a request to a server and the server sends back a response"><title>A client sends a request to a server and the server sends back a response</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}36%{opacity:0}37.5%{opacity:0.16}49%{opacity:0.16}50.5%{opacity:0}100%{opacity:0}}@keyframes mv2{0%{opacity:0;transform:translate(205px,105px)}5.95%{opacity:0;transform:translate(205px,105px)}6%{opacity:1;transform:translate(205px,105px)}34%{opacity:1;transform:translate(555px,105px)}34.8%{opacity:0;transform:translate(555px,105px)}100%{opacity:0;transform:translate(555px,105px)}}@keyframes lb3{0%{opacity:0}4%{opacity:0}5%{opacity:1}44%{opacity:1}45%{opacity:0}100%{opacity:0}}@keyframes lb4{0%{opacity:0}35%{opacity:0}36%{opacity:1}49%{opacity:1}50%{opacity:0}100%{opacity:0}}@keyframes mv5{0%{opacity:0;transform:translate(555px,150px)}51.95%{opacity:0;transform:translate(555px,150px)}52%{opacity:1;transform:translate(555px,150px)}82%{opacity:1;transform:translate(205px,150px)}82.8%{opacity:0;transform:translate(205px,150px)}100%{opacity:0;transform:translate(205px,150px)}}@keyframes lb6{0%{opacity:0}50%{opacity:0}51%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="270" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">The request-response conversation</text><rect x="30" y="60" width="170" height="120" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="115.0" y="114.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Client</text><text x="115.0" y="135.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Your browser or app</text><rect x="560" y="60" width="170" height="120" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="645.0" y="114.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Server</text><text x="645.0" y="135.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">A computer in a data centre</text><polyline points="205,105 553,105" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="555,150 207,150" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect class="hl" x="560" y="60" width="170" height="120" fill="#006A51" style="opacity:0;animation:hl1 8s linear infinite"/><g class="dot" style="opacity:0;animation:mv2 8s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb3 8s linear infinite">REQUEST: "GET /repairs/4821"</text><text class="lab slot" x="645" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5550" style="opacity:0;animation:lb4 8s linear infinite">Looking it up...</text><g class="dot" style="opacity:0;animation:mv5 8s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 8s linear infinite">RESPONSE: "200 OK" + the repair details</text><text x="380" y="240" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Every click, tap and app screen is one of these conversations.</text></svg>