<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Anatomy of a database table: columns, rows, primary key, foreign key and cells"><title>Anatomy of a database table: columns, rows, primary key, foreign key and cells</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}4%{opacity:0}5.5%{opacity:0.18}19%{opacity:0.18}20.5%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}22%{opacity:0}23.5%{opacity:0.18}37%{opacity:0.18}38.5%{opacity:0}100%{opacity:0}}@keyframes hl3{0%{opacity:0}40%{opacity:0}41.5%{opacity:0.18}55%{opacity:0.18}56.5%{opacity:0}100%{opacity:0}}@keyframes hl4{0%{opacity:0}58%{opacity:0}59.5%{opacity:0.18}73%{opacity:0.18}74.5%{opacity:0}100%{opacity:0}}@keyframes hl5{0%{opacity:0}76%{opacity:0}77.5%{opacity:0.3}91%{opacity:0.3}92.5%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}3%{opacity:0}4%{opacity:1}20%{opacity:1}21%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}21%{opacity:0}22%{opacity:1}38%{opacity:1}39%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}39%{opacity:0}40%{opacity:1}56%{opacity:1}57%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}57%{opacity:0}58%{opacity:1}74%{opacity:1}75%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}75%{opacity:0}76%{opacity:1}92%{opacity:1}93%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="350" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Anatomy of a table</text><text x="40" y="72" text-anchor="start" font-size="14" font-weight="700" fill="#1a2420">A table called "repairs"</text><rect x="40" y="90" width="80" height="34" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="111.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">id</text><rect x="120" y="90" width="190" height="34" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="111.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">address</text><rect x="310" y="90" width="110" height="34" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="320" y="111.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">priority</text><rect x="420" y="90" width="140" height="34" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="430" y="111.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">status</text><rect x="560" y="90" width="120" height="34" fill="#e6f2ee" stroke="#c9d4cf" stroke-width="1"/><text x="570" y="111.68" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">contractor_id</text><rect x="40" y="124" width="80" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="145.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">4821</text><rect x="120" y="124" width="190" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="145.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">12 Example Street</text><rect x="310" y="124" width="110" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="320" y="145.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">emergency</text><rect x="420" y="124" width="140" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="430" y="145.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">open</text><rect x="560" y="124" width="120" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="570" y="145.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">7</text><rect x="40" y="158" width="80" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">4822</text><rect x="120" y="158" width="190" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">3 Sample Road</text><rect x="310" y="158" width="110" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="320" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">routine</text><rect x="420" y="158" width="140" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="430" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">open</text><rect x="560" y="158" width="120" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="570" y="179.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">3</text><rect x="40" y="192" width="80" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="213.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">4823</text><rect x="120" y="192" width="190" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="213.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">9 Sample Close</text><rect x="310" y="192" width="110" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="320" y="213.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">urgent</text><rect x="420" y="192" width="140" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="430" y="213.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">closed</text><rect x="560" y="192" width="120" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="570" y="213.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">7</text><rect x="40" y="226" width="80" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="50" y="247.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">4824</text><rect x="120" y="226" width="190" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="130" y="247.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">21 Example Road</text><rect x="310" y="226" width="110" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="320" y="247.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">routine</text><rect x="420" y="226" width="140" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="430" y="247.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">open</text><rect x="560" y="226" width="120" height="34" fill="#fff" stroke="#c9d4cf" stroke-width="1"/><text x="570" y="247.68" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">12</text><rect class="hl" x="310" y="90" width="110" height="170" fill="#006A51" style="opacity:0;animation:hl1 16s linear infinite"/><rect class="hl" x="40" y="158" width="640" height="34" fill="#006A51" style="opacity:0;animation:hl2 16s linear infinite"/><rect class="hl" x="40" y="90" width="80" height="170" fill="#006A51" style="opacity:0;animation:hl3 16s linear infinite"/><rect class="hl" x="560" y="90" width="120" height="170" fill="#006A51" style="opacity:0;animation:hl4 16s linear infinite"/><rect class="hl" x="310" y="124" width="110" height="34" fill="#006A51" style="opacity:0;animation:hl5 16s linear infinite"/><text class="lab slot" x="380" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb6 16s linear infinite">A COLUMN holds one kind of information for every record</text><text class="lab slot" x="380" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 16s linear infinite">A ROW is one complete record: this is repair 4822</text><text class="lab slot" x="380" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb8 16s linear infinite">The PRIMARY KEY (id) is a unique label: no two rows share one</text><text class="lab slot" x="380" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb9 16s linear infinite">A FOREIGN KEY (contractor_id) points to a row in another table</text><text class="lab slot" x="380" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb10 16s linear infinite">A CELL is one value: repair 4821 has priority "emergency"</text><text x="380" y="335" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Everything in a relational database is built from these few pieces.</text></svg>