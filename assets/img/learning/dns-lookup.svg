<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="DNS translates a website name into an IP address, then the browser contacts that address"><title>DNS translates a website name into an IP address, then the browser contacts that address</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}13%{opacity:0}14.5%{opacity:0.16}27%{opacity:0.16}28.5%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}56%{opacity:0}57.5%{opacity:0.16}70%{opacity:0.16}71.5%{opacity:0}100%{opacity:0}}@keyframes mv3{0%{opacity:0;transform:translate(172px,115px)}4.95%{opacity:0;transform:translate(172px,115px)}5%{opacity:1;transform:translate(172px,115px)}20%{opacity:1;transform:translate(303px,85px)}20.8%{opacity:0;transform:translate(303px,85px)}100%{opacity:0;transform:translate(303px,85px)}}@keyframes mv4{0%{opacity:0;transform:translate(303px,100px)}28.95%{opacity:0;transform:translate(303px,100px)}29%{opacity:1;transform:translate(303px,100px)}44%{opacity:1;transform:translate(174px,140px)}44.8%{opacity:0;transform:translate(174px,140px)}100%{opacity:0;transform:translate(174px,140px)}}@keyframes mv5{0%{opacity:0;transform:translate(95px,182px)}51.95%{opacity:0;transform:translate(95px,182px)}52%{opacity:1;transform:translate(95px,182px)}53.89%{opacity:1;transform:translate(95px,235px)}74.18%{opacity:1;transform:translate(665px,235px)}76%{opacity:1;transform:translate(665px,184px)}76.8%{opacity:0;transform:translate(665px,184px)}100%{opacity:0;transform:translate(665px,184px)}}@keyframes mv6{0%{opacity:0;transform:translate(665px,184px)}79.95%{opacity:0;transform:translate(665px,184px)}80%{opacity:1;transform:translate(665px,184px)}81.14%{opacity:1;transform:translate(665px,235px)}93.86%{opacity:1;transform:translate(95px,235px)}95%{opacity:1;transform:translate(95px,184px)}95.8%{opacity:0;transform:translate(95px,184px)}100%{opacity:0;transform:translate(95px,184px)}}@keyframes lb7{0%{opacity:0}4%{opacity:0}5%{opacity:1}25%{opacity:1}26%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}28%{opacity:0}29%{opacity:1}47%{opacity:1}48%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}51%{opacity:0}52%{opacity:1}77%{opacity:1}78%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}79%{opacity:0}80%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="330" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Looking up a website: the first half second</text><rect x="20" y="90" width="150" height="90" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="95.0" y="129.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">You type</text><text x="95.0" y="150.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">gov.scot</text><rect x="305" y="45" width="150" height="80" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="380.0" y="79.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">DNS</text><text x="380.0" y="100.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">the phone book</text><rect x="590" y="90" width="150" height="90" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="665.0" y="129.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Web server</text><text x="665.0" y="150.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">at 203.0.113.7</text><polyline points="172,115 303,85" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="303,100 174,140" fill="none" stroke="#c9d4cf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><polyline points="95,182 95,235 665,235 665,184" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect class="hl" x="305" y="45" width="150" height="80" fill="#006A51" style="opacity:0;animation:hl1 12s linear infinite"/><rect class="hl" x="590" y="90" width="150" height="90" fill="#006A51" style="opacity:0;animation:hl2 12s linear infinite"/><g class="dot" style="opacity:0;animation:mv3 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv4 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><g class="dot" style="opacity:0;animation:mv5 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv6 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 12s linear infinite">1. Your device asks DNS: "where is gov.scot?"</text><text class="lab slot" x="380" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb8 12s linear infinite">2. DNS answers: "it is at 203.0.113.7"</text><text class="lab slot" x="380" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb9 12s linear infinite">3. Your device contacts that address and asks for the page</text><text class="lab slot" x="380" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 12s linear infinite">4. The page comes back and your browser shows it</text><text x="380" y="317" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">203.0.113.7 is a documentation example address, not a real server.</text></svg>