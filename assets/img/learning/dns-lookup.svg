<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img" aria-label="DNS translates a website name into an IP address" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="305" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Looking up a website: what happens in the first half second</text><rect x="20" y="80" width="140" height="80" rx="0" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="90.0" y="115.125" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">You type</text><text x="90.0" y="135.375" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">gov.scot</text><rect x="300" y="50" width="160" height="70" rx="0" fill="#fdf6ee" stroke="#d9822b" stroke-width="1.5"/><text x="380.0" y="80.125" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">DNS</text><text x="380.0" y="100.375" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">"the phone book"</text><rect x="600" y="80" width="140" height="80" rx="0" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="670.0" y="115.125" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Web server</text><text x="670.0" y="135.375" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">at 203.0.113.7</text><line x1="162" y1="100" x2="298" y2="85" stroke="#d9822b" stroke-width="2" marker-end="url(#a)"/><text x="215" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#d9822b">1. Where is it?</text><line x1="298" y1="105" x2="162" y2="125" stroke="#d9822b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="215" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#d9822b">2. "It's at 203.0.113.7"</text><polyline points="90,162 90,200 670,200 670,164" fill="none" stroke="#006A51" stroke-width="2" marker-end="url(#a)"/><text x="380" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#006A51">3. Now your browser contacts that address directly and asks for the page</text><text x="380" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">Names are for humans. Numbers (IP addresses) are for computers. DNS translates.</text><text x="380" y="284" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">(203.0.113.7 is a documentation example address, not a real server.)</text></svg>