<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-label="A bank transfer is a transaction: all steps succeed together or the whole thing is undone"><title>A bank transfer is a transaction: all steps succeed together or the whole thing is undone</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(135px,132px)}3.95%{opacity:0;transform:translate(135px,132px)}4%{opacity:1;transform:translate(135px,132px)}22%{opacity:1;transform:translate(375px,132px)}40%{opacity:1;transform:translate(615px,132px)}40.8%{opacity:0;transform:translate(615px,132px)}100%{opacity:0;transform:translate(615px,132px)}}@keyframes mv2{0%{opacity:0;transform:translate(135px,292px)}47.95%{opacity:0;transform:translate(135px,292px)}48%{opacity:1;transform:translate(135px,292px)}62%{opacity:1;transform:translate(375px,292px)}62.8%{opacity:0;transform:translate(375px,292px)}100%{opacity:0;transform:translate(375px,292px)}}@keyframes hl3{0%{opacity:0}64%{opacity:0}65.5%{opacity:0.4}72%{opacity:0.4}73.5%{opacity:0}100%{opacity:0}}@keyframes mv4{0%{opacity:0;transform:translate(375px,292px)}73.95%{opacity:0;transform:translate(375px,292px)}74%{opacity:1;transform:translate(375px,292px)}90%{opacity:1;transform:translate(135px,292px)}90.8%{opacity:0;transform:translate(135px,292px)}100%{opacity:0;transform:translate(135px,292px)}}@keyframes lb5{0%{opacity:0}3%{opacity:0}4%{opacity:1}44%{opacity:1}45%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}47%{opacity:0}48%{opacity:1}72%{opacity:1}73%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}73%{opacity:0}74%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="375" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">A transaction: all or nothing</text><text x="30" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#006A51">Everything works</text><rect x="30" y="80" width="210" height="60" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="135.0" y="114.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Take £50 from Account A</text><polyline points="242,110 268,110" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="270" y="80" width="210" height="60" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="375.0" y="114.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Add £50 to Account B</text><polyline points="482,110 508,110" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="510" y="80" width="210" height="60" fill="#006A51" stroke="#006A51" stroke-width="1.5"/><text x="615.0" y="114.55" text-anchor="middle" font-size="13" font-weight="400" fill="#fff">Commit: make it permanent</text><text x="30" y="226" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">Something fails halfway</text><rect x="30" y="240" width="210" height="60" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="135.0" y="274.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Take £50 from Account A</text><polyline points="242,270 268,270" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="270" y="240" width="210" height="60" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="375.0" y="274.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Add £50 to Account B</text><polyline points="482,270 508,270" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="510" y="240" width="210" height="60" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="615.0" y="274.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Commit: make it permanent</text><g class="dot" style="opacity:0;animation:mv1 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv2 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><rect class="hl" x="270" y="240" width="210" height="60" fill="#006A51" style="opacity:0;animation:hl3 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv4 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb5 14s linear infinite">The top lane commits: both accounts are updated together</text><text class="lab slot" x="380" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 14s linear infinite">Step 2 fails. The bank must not keep step 1</text><text class="lab slot" x="380" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb7 14s linear infinite">Rollback: step 1 is undone, as if it never happened</text><text x="380" y="360" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Without transactions, a crash between the two steps would make £50 vanish.</text></svg>