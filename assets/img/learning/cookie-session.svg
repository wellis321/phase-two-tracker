<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Logging in gives the browser a cookie that is sent with every later request so the server recognises it"><title>Logging in gives the browser a cookie that is sent with every later request so the server recognises it</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(235px,110px)}3.95%{opacity:0;transform:translate(235px,110px)}4%{opacity:1;transform:translate(235px,110px)}22%{opacity:1;transform:translate(525px,110px)}22.8%{opacity:0;transform:translate(525px,110px)}100%{opacity:0;transform:translate(525px,110px)}}@keyframes hl2{0%{opacity:0}24%{opacity:0}25.5%{opacity:0.16}30%{opacity:0.16}31.5%{opacity:0}100%{opacity:0}}@keyframes mv3{0%{opacity:0;transform:translate(525px,160px)}28.95%{opacity:0;transform:translate(525px,160px)}29%{opacity:1;transform:translate(525px,160px)}45%{opacity:1;transform:translate(235px,160px)}45.8%{opacity:0;transform:translate(235px,160px)}100%{opacity:0;transform:translate(235px,160px)}}@keyframes mv4{0%{opacity:0;transform:translate(260px,110px)}51.95%{opacity:0;transform:translate(260px,110px)}52%{opacity:1;transform:translate(260px,110px)}68%{opacity:1;transform:translate(500px,110px)}68.8%{opacity:0;transform:translate(500px,110px)}100%{opacity:0;transform:translate(500px,110px)}}@keyframes hl5{0%{opacity:0}69%{opacity:0}70.5%{opacity:0.16}75%{opacity:0.16}76.5%{opacity:0}100%{opacity:0}}@keyframes mv6{0%{opacity:0;transform:translate(500px,160px)}75.95%{opacity:0;transform:translate(500px,160px)}76%{opacity:1;transform:translate(500px,160px)}90%{opacity:1;transform:translate(260px,160px)}90.8%{opacity:0;transform:translate(260px,160px)}100%{opacity:0;transform:translate(260px,160px)}}@keyframes lb7{0%{opacity:0}3%{opacity:0}4%{opacity:1}27%{opacity:1}28%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}28%{opacity:0}29%{opacity:1}49%{opacity:1}50%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}51%{opacity:0}52%{opacity:1}71%{opacity:1}72%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}73%{opacity:0}74%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="340" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">How a website remembers you</text><rect x="20" y="80" width="170" height="110" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="105.0" y="129.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Your browser</text><text x="105.0" y="150.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Holds the cookie</text><rect x="570" y="80" width="170" height="110" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="655.0" y="129.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">The server</text><text x="655.0" y="150.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Remembers code = you</text><polyline points="194,110 566,110" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="566,160 196,160" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><g class="dot" style="opacity:0;animation:mv1 14s linear infinite"><rect x="-48.0" y="-12.0" width="96" height="24" fill="#006A51"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">login</text></g><rect class="hl" x="570" y="80" width="170" height="110" fill="#006A51" style="opacity:0;animation:hl2 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv3 14s linear infinite"><rect x="-48.0" y="-12.0" width="96" height="24" fill="#1a2420"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">cookie</text></g><g class="dot" style="opacity:0;animation:mv4 14s linear infinite"><rect x="-85.0" y="-12.0" width="170" height="24" fill="#006A51"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">GET /jobs + cookie</text></g><rect class="hl" x="570" y="80" width="170" height="110" fill="#006A51" style="opacity:0;animation:hl5 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv6 14s linear infinite"><rect x="-55.0" y="-12.0" width="110" height="24" fill="#1a2420"/><text x="0" y="4.32" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">your jobs</text></g><text class="lab slot" x="380" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb7 14s linear infinite">1. You log in: username and password go to the server.</text><text class="lab slot" x="380" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb8 14s linear infinite">2. The server gives your browser a cookie: a wristband with a unique code.</text><text class="lab slot" x="380" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb9 14s linear infinite">3. Every later request carries the cookie automatically.</text><text class="lab slot" x="380" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 14s linear infinite">4. The server reads the code, knows who you are and answers.</text><text x="380" y="295" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Whoever holds the cookie is treated as you. That is why stolen cookies matter.</text></svg>