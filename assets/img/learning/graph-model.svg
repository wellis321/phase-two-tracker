158" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="235" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">carried out</text><polyline points="432,158 498,158" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="465" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5550">at</text><polyline points="580,172 580,248" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="590" y="214" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">home of</text><polyline points="120,248 120,172" fill="none" stroke="#4a5550" stroke-width="2" marker-end="url(#ah)"/><text x="130" y="214" text-anchor="start" font-size="11" font-weight="400" fill="#4a5550">works for</text><rect x="40" y="120" width="160" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="120.0" y="149.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Contractor</text><rect x="270" y="120" width="160" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="350.0" y="149.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Repair</text><rect x="500" y="120" width="160" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="580.0" y="149.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Property</text><rect x="500" y="250" width="160" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="580.0" y="279.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Tenant</text><rect x="40" y="250" width="160" height="50" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="120.0" y="279.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Operative</text><rect class="hl" x="40" y="120" width="160" height="50" fill="#006A51" style="opacity:0;animation:hl1 14s linear infinite"/><rect class="hl" x="270" y="120" width="160" height="50" fill="#006A51" style="opacity:0;animation:hl2 14s linear infinite"/><rect class="hl" x="500" y="120" width="160" height="50" fill="#006A51" style="opacity:0;animation:hl3 14s linear infinite"/><rect class="hl" x="500" y="250" width="160" height="50" fill="#006A51" style="opacity:0;animation:hl4 14s linear infinite"/><g class="dot" style="opacity:0;animation:mv5 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb6 14s linear infinite">Question: which tenants have had work done by this contractor?</text><text class="lab slot" x="380" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb7 14s linear infinite">Walk the links: contractor, to their repairs, to the properties, to the tenants</text><text x="380" y="380" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">Microsoft Graph applies the same idea to work: people, meetings, files, mail and teams, all linked.</text></svg>