<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Memory from fastest to slowest: CPU, cache, RAM and storage, plus ROM; RAM and cache forget when the power goes off, storage and ROM remember"><title>Memory from fastest to slowest: CPU, cache, RAM and storage, plus ROM; RAM and cache forget when the power goes off, storage and ROM remember</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(150px,268px)}3.95%{opacity:0;transform:translate(150px,268px)}4%{opacity:1;transform:translate(150px,268px)}7.91%{opacity:1;transform:translate(150px,238px)}11.55%{opacity:1;transform:translate(150px,210px)}15.46%{opacity:1;transform:translate(150px,180px)}19.1%{opacity:1;transform:translate(150px,152px)}23.01%{opacity:1;transform:translate(150px,122px)}26%{opacity:1;transform:translate(150px,99px)}26.8%{opacity:0;transform:translate(150px,99px)}100%{opacity:0;transform:translate(150px,99px)}}@keyframes hl2{0%{opacity:0}24%{opacity:0}25.5%{opacity:0.3}48%{opacity:0.3}49.5%{opacity:0}100%{opacity:0}}@keyframes fd3{0%{opacity:0}51%{opacity:0}53%{opacity:1}77%{opacity:1}79%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:0}100%{opacity:0}}@keyframes fd4{0%{opacity:0}51%{opacity:0}53%{opacity:1}77%{opacity:1}79%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:0}100%{opacity:0}}@keyframes fd5{0%{opacity:0}53%{opacity:0}55%{opacity:1}77%{opacity:1}79%{opacity:0}93%{opacity:0}94%{opacity:0}95.5%{opacity:0}100%{opacity:0}}@keyframes lb6{0%{opacity:0}3%{opacity:0}4%{opacity:1}30%{opacity:1}31%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}3%{opacity:0}4%{opacity:1}30%{opacity:1}31%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}31%{opacity:0}32%{opacity:1}50%{opacity:1}51%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}31%{opacity:0}32%{opacity:1}50%{opacity:1}51%{opacity:0}100%{opacity:0}}@keyframes lb10{0%{opacity:0}51%{opacity:0}52%{opacity:1}78%{opacity:1}79%{opacity:0}100%{opacity:0}}@keyframes lb11{0%{opacity:0}51%{opacity:0}52%{opacity:1}78%{opacity:1}79%{opacity:0}100%{opacity:0}}@keyframes lb12{0%{opacity:0}79%{opacity:0}80%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}@keyframes lb13{0%{opacity:0}79%{opacity:0}80%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="450" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">RAM, ROM and storage: where data lives</text><text x="330" y="66" text-anchor="start" font-size="12" font-weight="700" fill="#4a5550">Typical size</text><text x="470" y="66" text-anchor="start" font-size="12" font-weight="700" fill="#4a5550">Speed</text><text x="580" y="66" text-anchor="start" font-size="12" font-weight="700" fill="#4a5550">If the power goes off</text><rect x="40" y="74" width="250" height="46" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="165.0" y="92.10000000000001" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">CPU</text><text x="165.0" y="111.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">does the calculating</text><text x="330" y="102" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420"></text><text x="470" y="102" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420"></text><text x="580" y="102" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420"></text><rect x="40" y="132" width="250" height="46" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="165.0" y="150.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Cache</text><text x="165.0" y="169.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">tiny, right next to the CPU</text><text x="330" y="160" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">a few MB</text><text x="470" y="160" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">fastest</text><text x="580" y="160" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">forgets</text><rect x="40" y="190" width="250" height="46" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="165.0" y="208.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">RAM</text><text x="165.0" y="227.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">the working desk</text><text x="330" y="218" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">8 to 32 GB</text><text x="470" y="218" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">very fast</text><text x="580" y="218" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">forgets</text><rect x="40" y="248" width="250" height="46" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="165.0" y="266.09999999999997" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Storage (SSD or disk)</text><text x="165.0" y="285.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">the filing cabinet</text><text x="330" y="276" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">256 GB to 4 TB</text><text x="470" y="276" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">slower</text><text x="580" y="276" text-anchor="start" font-size="13" font-weight="700" fill="#006A51">remembers</text><rect x="40" y="306" width="250" height="46" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="165.0" y="324.09999999999997" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">ROM / firmware</text><text x="165.0" y="343.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">start-up instructions</text><text x="330" y="334" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">a few MB</text><text x="470" y="334" text-anchor="start" font-size="13" font-weight="400" fill="#1a2420">n/a</text><text x="580" y="334" text-anchor="start" font-size="13" font-weight="700" fill="#006A51">remembers</text><polyline points="165,130 165,122" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="165,188 165,180" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="165,246 165,238" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><g class="dot" style="opacity:0;animation:mv1 16s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><rect class="hl" x="40" y="190" width="250" height="46" fill="#006A51" style="opacity:0;animation:hl2 16s linear infinite"/><g class="fd" style="animation:fd3 16s linear infinite"><rect x="40" y="132" width="250" height="46" fill="#fff" stroke="#1a2420" stroke-width="1.5" stroke-dasharray="6 5"/><text x="165" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">empty: power cut</text></g><g class="fd" style="animation:fd4 16s linear infinite"><rect x="40" y="190" width="250" height="46" fill="#fff" stroke="#1a2420" stroke-width="1.5" stroke-dasharray="6 5"/><text x="165" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">empty: power cut</text></g><g class="fd" style="animation:fd5 16s linear infinite"><rect x="40" y="248" width="250" height="46" fill="#fff" stroke="#006A51" stroke-width="1.5"/><text x="165" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51">still here: the file</text></g><rect x="30" y="372" width="700" height="66" fill="#f7f8f7" stroke="#c9d4cf" stroke-width="1.5"/><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 16s linear infinite">Opening a file: storage, then RAM, then cache, then CPU</text><text class="lab slot" x="380" y="423" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb7 16s linear infinite">Data is copied up to faster memory so it can be used</text><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb8 16s linear infinite">RAM holds what you are working on now</text><text class="lab slot" x="380" y="423" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb9 16s linear infinite">Very fast, but it needs power to keep its contents</text><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb10 16s linear infinite">Power cut: RAM and cache are emptied</text><text class="lab slot" x="380" y="423" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb11 16s linear infinite">Storage and ROM still remember</text><text class="lab slot" x="380" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb12 16s linear infinite">Unsaved work lived only in RAM</text><text class="lab slot" x="380" y="423" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5550" style="opacity:0;animation:lb13 16s linear infinite">That is why we save, and why systems keep logs</text></svg>