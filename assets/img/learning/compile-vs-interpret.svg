<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Compiled code is translated once before running; interpreted code is translated as it runs"><title>Compiled code is translated once before running; interpreted code is translated as it runs</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes mv1{0%{opacity:0;transform:translate(115px,143px)}3.95%{opacity:0;transform:translate(115px,143px)}4%{opacity:1;transform:translate(115px,143px)}18.92%{opacity:1;transform:translate(335px,143px)}33.83%{opacity:1;transform:translate(555px,143px)}44%{opacity:1;transform:translate(705px,143px)}44.8%{opacity:0;transform:translate(705px,143px)}100%{opacity:0;transform:translate(705px,143px)}}@keyframes mv2{0%{opacity:0;transform:translate(115px,278px)}49.95%{opacity:0;transform:translate(115px,278px)}50%{opacity:1;transform:translate(115px,278px)}65.51%{opacity:1;transform:translate(420px,278px)}80%{opacity:1;transform:translate(705px,278px)}80.8%{opacity:0;transform:translate(705px,278px)}100%{opacity:0;transform:translate(705px,278px)}}@keyframes lb3{0%{opacity:0}3%{opacity:0}4%{opacity:1}48%{opacity:1}49%{opacity:0}100%{opacity:0}}@keyframes lb4{0%{opacity:0}49%{opacity:0}50%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="350" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">Two ways code becomes action</text><text x="30" y="70" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">COMPILED  (for example C, Go, Rust; Java and C# compile to an in-between form)</text><rect x="30" y="85" width="170" height="70" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="115.0" y="115.10000000000001" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Source code</text><text x="115.0" y="134.70000000000002" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">what people write</text><rect x="250" y="85" width="170" height="70" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="335.0" y="115.10000000000001" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Compiler</text><text x="335.0" y="134.70000000000002" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">translates it all, once</text><rect x="470" y="85" width="170" height="70" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="555.0" y="115.10000000000001" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Program file</text><text x="555.0" y="134.70000000000002" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">ready to run</text><rect x="660" y="85" width="90" height="70" fill="#006A51" stroke="#006A51" stroke-width="1.5"/><text x="705.0" y="115.10000000000001" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Runs</text><text x="705.0" y="134.70000000000002" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">fast</text><polyline points="202,120 248,120" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="422,120 468,120" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="642,120 658,120" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><g class="dot" style="opacity:0;animation:mv1 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text x="30" y="205" text-anchor="start" font-size="13" font-weight="700" fill="#1a2420">INTERPRETED  (for example Python, JavaScript, PHP)</text><rect x="30" y="220" width="170" height="70" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="115.0" y="250.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Source code</text><text x="115.0" y="269.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">what people write</text><rect x="250" y="220" width="340" height="70" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="420.0" y="250.1" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420">Interpreter</text><text x="420.0" y="269.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1a2420">reads and runs it as it goes, line by line</text><rect x="660" y="220" width="90" height="70" fill="#006A51" stroke="#006A51" stroke-width="1.5"/><text x="705.0" y="250.1" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Runs</text><text x="705.0" y="269.7" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">at once</text><polyline points="202,255 248,255" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="592,255 658,255" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><g class="dot" style="opacity:0;animation:mv2 14s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb3 14s linear infinite">Compiled: one big translation up front, then very quick to run</text><text class="lab slot" x="380" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb4 14s linear infinite">Interpreted: no waiting to build, easy to try and change, a little slower to run</text></svg>