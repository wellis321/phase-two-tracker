<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="An API compared with a waiter between customer and kitchen" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="312" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">An API is like a waiter</text><rect x="20" y="70" width="180" height="100" rx="0" fill="#fff" stroke="#4a5550" stroke-width="1.5"/><text x="110.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">You (the customer)</text><text x="110.0" y="125.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Looks at the menu,</text><text x="110.0" y="145.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">places an order</text><rect x="290" y="70" width="180" height="100" rx="0" fill="#fdf6ee" stroke="#d9822b" stroke-width="1.5"/><text x="380.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">The waiter</text><text x="380.0" y="125.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Takes your order,</text><text x="380.0" y="145.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">brings back the food</text><rect x="560" y="70" width="180" height="100" rx="0" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="650.0" y="105.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">The kitchen</text><text x="650.0" y="125.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Does the real work,</text><text x="650.0" y="145.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">you never see in</text><line x1="202" y1="120" x2="288" y2="120" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="472" y1="120" x2="558" y2="120" stroke="#4a5550" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="110" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51">= an app or system</text><text x="380" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#d9822b">= the API</text><text x="650" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#3b6ea8">= the other system</text><text x="110" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">(the "client")</text><text x="380" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">(menu of what you can ask for)</text><text x="650" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">(its data and logic)</text><text x="380" y="268" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">You can't walk into the kitchen. You can only order what's on the menu, in the way the waiter understands.</text><text x="380" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">That restriction is the point: it keeps the kitchen safe, consistent and in control.</text></svg>