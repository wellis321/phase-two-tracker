<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="An API works like a waiter carrying orders to the kitchen and food back to the customer"><title>An API works like a waiter carrying orders to the kitchen and food back to the customer</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}15%{opacity:0}16.5%{opacity:0.16}28%{opacity:0.16}29.5%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}33%{opacity:0}34.5%{opacity:0.16}45%{opacity:0.16}46.5%{opacity:0}100%{opacity:0}}@keyframes hl3{0%{opacity:0}62%{opacity:0}63.5%{opacity:0.16}74%{opacity:0.16}75.5%{opacity:0}100%{opacity:0}}@keyframes mv4{0%{opacity:0;transform:translate(110px,66px)}4.95%{opacity:0;transform:translate(110px,66px)}5%{opacity:1;transform:translate(110px,66px)}21.5%{opacity:1;transform:translate(380px,66px)}38%{opacity:1;transform:translate(650px,66px)}38.8%{opacity:0;transform:translate(650px,66px)}100%{opacity:0;transform:translate(650px,66px)}}@keyframes mv5{0%{opacity:0;transform:translate(650px,204px)}51.95%{opacity:0;transform:translate(650px,204px)}52%{opacity:1;transform:translate(650px,204px)}70%{opacity:1;transform:translate(380px,204px)}88%{opacity:1;transform:translate(110px,204px)}88.8%{opacity:0;transform:translate(110px,204px)}100%{opacity:0;transform:translate(110px,204px)}}@keyframes lb6{0%{opacity:0}4%{opacity:0}5%{opacity:1}44%{opacity:1}45%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}51%{opacity:0}52%{opacity:1}94%{opacity:1}95%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="320" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">An API is like a waiter</text><polyline points="110,66 650,66" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><polyline points="650,204 110,204" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="86" width="180" height="100" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="110.0" y="130.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">The customer</text><text x="110.0" y="151.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">An app or system</text><rect x="290" y="86" width="180" height="100" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="380.0" y="130.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">The waiter</text><text x="380.0" y="151.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">This is the API</text><rect x="560" y="86" width="180" height="100" fill="#f7f8f7" stroke="#1a2420" stroke-width="1.5"/><text x="650.0" y="130.75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">The kitchen</text><text x="650.0" y="151.75" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">The other system</text><rect class="hl" x="290" y="86" width="180" height="100" fill="#006A51" style="opacity:0;animation:hl1 9s linear infinite"/><rect class="hl" x="560" y="86" width="180" height="100" fill="#006A51" style="opacity:0;animation:hl2 9s linear infinite"/><rect class="hl" x="290" y="86" width="180" height="100" fill="#006A51" style="opacity:0;animation:hl3 9s linear infinite"/><g class="dot" style="opacity:0;animation:mv4 9s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><g class="dot" style="opacity:0;animation:mv5 9s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#1a2420"/></g><text class="lab slot" x="380" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#006A51" style="opacity:0;animation:lb6 9s linear infinite">ORDER (a request): "one repair record, please"</text><text class="lab slot" x="380" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb7 9s linear infinite">FOOD (a response): the record comes back</text><text x="380" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">You cannot walk into the kitchen. You can only order what is on the menu.</text><text x="380" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">That restriction keeps the kitchen safe, consistent and in control.</text></svg>