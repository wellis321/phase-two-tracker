<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Development, test, UAT and live environments" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="250" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Software moves through environments before real users see it</text><rect x="20" y="70" width="150" height="90" rx="8" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="95.0" y="99.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Development</text><text x="95.0" y="120.6" text-anchor="middle" font-size="14" font-weight="400" fill="#1a2420">Developers build</text><text x="95.0" y="142.2" text-anchor="middle" font-size="14" font-weight="400" fill="#1a2420">and break things</text><line x1="172" y1="115" x2="203" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)"/><rect x="205" y="70" width="150" height="90" rx="8" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="280.0" y="99.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">Test</text><text x="280.0" y="120.6" text-anchor="middle" font-size="14" font-weight="400" fill="#1a2420">Testers check it</text><text x="280.0" y="142.2" text-anchor="middle" font-size="14" font-weight="400" fill="#1a2420">works as designed</text><line x1="357" y1="115" x2="388" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="70" width="150" height="90" rx="8" fill="#e6f2ee" stroke="#006A51" stroke-width="1.5"/><text x="465.0" y="99.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2420">UAT</text><text x="465.0" y="120.6" text-anchor="middle" font-size="14" font-weight="400" fill="#1a2420">People who know the</text><text x="465.0" y="142.2" text-anchor="middle" font-size="14" font-weight="400" fill="#1a2420">job try it for real</text><line x1="542" y1="115" x2="573" y2="115" stroke="#4a5550" stroke-width="2" marker-end="url(#a)"/><rect x="575" y="70" width="150" height="90" rx="8" fill="#006A51" stroke="#006A51" stroke-width="1.5"/><text x="650.0" y="99.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Live</text><text x="650.0" y="120.6" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">Real tenants and</text><text x="650.0" y="142.2" text-anchor="middle" font-size="14" font-weight="400" fill="#fff">staff use it</text><text x="380" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">UAT = User Acceptance Testing. This is where your project workers' expertise matters most:</text><text x="380" y="226" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5550">only someone who knows repairs can say "that's not how an emergency job actually works".</text></svg>