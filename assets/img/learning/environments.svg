<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Software moves through development, test, UAT and live before real users see it"><title>Software moves through development, test, UAT and live before real users see it</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.dot,.hl{display:none}.slot{display:none}.fd{animation:none!important;opacity:1!important}}@keyframes hl1{0%{opacity:0}2%{opacity:0}3.5%{opacity:0.16}14%{opacity:0.16}15.5%{opacity:0}100%{opacity:0}}@keyframes hl2{0%{opacity:0}23.33%{opacity:0}24.83%{opacity:0.16}35.33%{opacity:0.16}36.83%{opacity:0}100%{opacity:0}}@keyframes hl3{0%{opacity:0}44.67%{opacity:0}46.17%{opacity:0.16}56.67%{opacity:0.16}58.17%{opacity:0}100%{opacity:0}}@keyframes hl4{0%{opacity:0}66%{opacity:0}67.5%{opacity:0.16}78%{opacity:0.16}79.5%{opacity:0}100%{opacity:0}}@keyframes mv5{0%{opacity:0;transform:translate(95px,66px)}7.95%{opacity:0;transform:translate(95px,66px)}8%{opacity:1;transform:translate(95px,66px)}29.33%{opacity:1;transform:translate(280px,66px)}50.67%{opacity:1;transform:translate(465px,66px)}72%{opacity:1;transform:translate(650px,66px)}72.8%{opacity:0;transform:translate(650px,66px)}100%{opacity:0;transform:translate(650px,66px)}}@keyframes lb6{0%{opacity:0}5%{opacity:0}6%{opacity:1}24%{opacity:1}25%{opacity:0}100%{opacity:0}}@keyframes lb7{0%{opacity:0}25%{opacity:0}26%{opacity:1}42%{opacity:1}43%{opacity:0}100%{opacity:0}}@keyframes lb8{0%{opacity:0}43%{opacity:0}44%{opacity:1}60%{opacity:1}61%{opacity:0}100%{opacity:0}}@keyframes lb9{0%{opacity:0}61%{opacity:0}62%{opacity:1}90%{opacity:1}91%{opacity:0}100%{opacity:0}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5550"/></marker></defs><rect width="760" height="280" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2420">A change moves forward only when each stage passes</text><polyline points="95,66 650,66" fill="none" stroke="#c9d4cf" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="90" width="150" height="90" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="95.0" y="119.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Development</text><text x="95.0" y="140.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Developers build</text><text x="95.0" y="161.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">and break things</text><rect class="hl" x="20" y="90" width="150" height="90" fill="#006A51" style="opacity:0;animation:hl1 12s linear infinite"/><rect x="205" y="90" width="150" height="90" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="280.0" y="119.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">Test</text><text x="280.0" y="140.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">Testers check it</text><text x="280.0" y="161.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">works as designed</text><rect class="hl" x="205" y="90" width="150" height="90" fill="#006A51" style="opacity:0;animation:hl2 12s linear infinite"/><rect x="390" y="90" width="150" height="90" fill="#fff" stroke="#1a2420" stroke-width="1.5"/><text x="465.0" y="119.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2420">UAT</text><text x="465.0" y="140.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">People who know the</text><text x="465.0" y="161.25" text-anchor="middle" font-size="13" font-weight="400" fill="#1a2420">job try it for real</text><rect class="hl" x="390" y="90" width="150" height="90" fill="#006A51" style="opacity:0;animation:hl3 12s linear infinite"/><rect x="575" y="90" width="150" height="90" fill="#006A51" stroke="#006A51" stroke-width="1.5"/><text x="650.0" y="119.25" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Live</text><text x="650.0" y="140.25" text-anchor="middle" font-size="13" font-weight="400" fill="#fff">Real tenants and</text><text x="650.0" y="161.25" text-anchor="middle" font-size="13" font-weight="400" fill="#fff">staff use it</text><rect class="hl" x="575" y="90" width="150" height="90" fill="#006A51" style="opacity:0;animation:hl4 12s linear infinite"/><g class="dot" style="opacity:0;animation:mv5 12s linear infinite"><rect x="-7.0" y="-7.0" width="14" height="14" fill="#006A51"/></g><text class="lab slot" x="380" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb6 12s linear infinite">Built and broken freely, away from real users</text><text class="lab slot" x="380" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb7 12s linear infinite">Checked by testers against the design</text><text class="lab slot" x="380" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#006A51" style="opacity:0;animation:lb8 12s linear infinite">Accepted by the people who know the real work (UAT)</text><text class="lab slot" x="380" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2420" style="opacity:0;animation:lb9 12s linear infinite">Released to real users, with a way to roll back</text><text x="380" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5550">UAT = User Acceptance Testing. This is where subject experts matter most.</text></svg>